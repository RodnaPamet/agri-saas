#
# agrent — single-VM deploy (GCP / europe-west1-b).
# Caddy terminates TLS (Let's Encrypt via sslip.io) and reverse-proxies
# to the Next.js app. Postgres + PgBouncer + Redis are internal-only.
# No ClamAV (lean), local file storage. App + worker build from the
# repo Dockerfile in this directory.
#
# Interpolation + container env both come from ./.env (compose default
# env file). Build once as agrent-app:local; app + worker share it.
#

# ── Log rotation (#1507) ────────────────────────────────────────────────
#
# Docker's default `json-file` driver NEVER rotates. On 2026-10-07 this VM's
# 79 GB disk reached 100%: playerz-db PANICked on a checkpoint and agrent's
# Redis failed its background saves with MISCONF until space was freed. Images
# and build cache were the main cause; container logs are the other unbounded
# thing on the same disk.
#
# PER SERVICE, deliberately, and NOT in /etc/docker/daemon.json. That file is
# shared with playerz.bg, which runs on this same VM, and changing it needs a
# Docker daemon restart — taking BOTH products down. A compose-level option
# touches only agrent's containers and is applied by recreating them.
#
# 10m x 3 is 30 MB per container, so ~210 MB across the seven services below —
# a bound, where there was none. It is deliberately not smaller: these logs are
# the only record of a 502 window or a failed migration, and `docker logs` is
# how both get diagnosed.
#
# APPLYING THIS NEEDS A RECREATE. The option is read when a container is
# CREATED, so an existing container keeps its unbounded log until the next
# `docker compose up -d --force-recreate`. That is a short restart for db and
# redis and a 502 window for app, so it is the owner's call to schedule — this
# file being correct is not the same as the VM being fixed.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ── Postgres (PostGIS + pgvector — spray-map geometry + RAG embeddings) ──
  db:
    logging: *logging
    build:
      context: ./deploy/postgres
    image: agrent-db:local
    container_name: agrent-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-agrent_production}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # `./deploy/init-roles.sh`, not `./init-roles.sh` — #2319.
      #
      # The repo keeps this script in `deploy/`. The old path resolved to the
      # project root, where a CLONE has no such file, and production satisfied
      # it with an untracked copy somebody placed at `/opt/agrent/init-roles.sh`
      # (it still has three copies: root, `deploy/`, `prisma/`).
      #
      # A bind mount whose source does not exist makes Docker create a
      # DIRECTORY there, so initdb mounted an empty directory, ran nothing, and
      # Postgres came up healthy with no `app_user`. The first RLS migration
      # then failed on `role "app_user" does not exist` — three steps
      # downstream of the cause, and looking like a migration bug.
      #
      # This path resolves in BOTH layouts: the repo has `deploy/init-roles.sh`
      # and so does `/opt/agrent`. Verified on the VM before changing it.
      - ./deploy/init-roles.sh:/docker-entrypoint-initdb.d/01-init-roles.sh:ro
    shm_size: '256m'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-inflect} -d ${POSTGRES_DB:-agrent_production}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  # ── PgBouncer (transaction pooler) ──
  pgbouncer:
    logging: *logging
    image: edoburu/pgbouncer:latest
    container_name: agrent-pgbouncer
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-inflect}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB:-agrent_production}
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: "25"
      MAX_CLIENT_CONN: "200"
      MAX_DB_CONNECTIONS: "50"
      AUTH_TYPE: scram-sha-256
      STATS_PERIOD: "60"
      ADMIN_USERS: ${POSTGRES_USER:-inflect}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ${POSTGRES_USER:-inflect}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  # ── Redis (cache + BullMQ) ──
  redis:
    logging: *logging
    image: redis:7-alpine
    container_name: agrent-redis
    restart: always
    command: redis-server --requirepass "${REDIS_PASSWORD:?REDIS_PASSWORD is required}" --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  # ── Next.js app ──
  app:
    logging: *logging
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_MAPTILER_KEY: ${NEXT_PUBLIC_MAPTILER_KEY}
        NEXT_PUBLIC_MAP_BASEMAP_STYLE: ${NEXT_PUBLIC_MAP_BASEMAP_STYLE:-hybrid}
    # Auto-deploy: run the image Watchtower pulls from GHCR. The build:
    # block above is retained as a manual escape hatch — `docker compose
    # build app` still rebuilds locally under this same tag if GHCR is
    # unavailable.
    image: ghcr.io/rodnapamet/agri-saas:latest
    container_name: agrent-app
    restart: always
    # ── P7.3 (#1992) — the window SIGTERM gets before SIGKILL ──
    #
    # Docker's default is 10s. Next's own self-hosting guidance for the App
    # Router is to send the signal and "allow a configurable drain period
    # (10-30 seconds is recommended)", because `next start` answers SIGTERM
    # with `server.close()` — stop accepting connections, then WAIT for the
    # open ones, deliberately without forcing them closed.
    #
    # Must AGREE with watchtower's `--stop-timeout` below. Watchtower stops the
    # containers it recreates, so ITS timeout governs the ~8 recreations a day
    # that are the only thing that ever interrupts a live stream; this one
    # governs a manual `docker compose stop`. One without the other buys a
    # drain that works when an operator stops the stack by hand and not when
    # the deploy pipeline does.
    #
    # APPLYING THIS NEEDS A RECREATE, for the same reason the `x-logging`
    # block above says so: `stop_grace_period` is read when a container is
    # CREATED. Watchtower's next image pull recreates `app` and `worker`, so
    # those two pick it up on the next deploy; `watchtower` itself is not
    # watchtower-enabled and needs a manual `up -d` to adopt its new flag.
    stop_grace_period: 30s
    # Watchtower only touches containers carrying this label.
    labels:
      - com.centurylinklabs.watchtower.enable=true
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-inflect}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB:-agrent_production}?schema=public&pgbouncer=true
      DIRECT_DATABASE_URL: postgresql://${POSTGRES_USER:-inflect}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-agrent_production}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      STORAGE_PROVIDER: local
      # #1811 — `strict` is the DEFAULT here and in src/env.ts, so an operator
      # has to opt OUT of scanning rather than into it. It was a hardcoded
      # `disabled` in this file, which silently overrode the .env value: a
      # compose `environment:` entry beats `env_file`, so setting
      # AV_SCAN_MODE=strict in /opt/agrent/.env changed nothing. The process
      # env is the only place that tells you which won.
      AV_SCAN_MODE: ${AV_SCAN_MODE:-strict}
      # Explicit, so the app -> clamav wiring is visible beside the service
      # that provides it. clamd's port, on the internal network, never published.
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav:3310}
      # P1.8 — the VM's own Redis, so budgets survive a deploy.
      # "memory" kept every counter in-process, and Watchtower
      # recreates this container on each image push.
      RATE_LIMIT_MODE: redis
      FILE_STORAGE_ROOT: /data/uploads
      UPLOAD_DIR: /data/uploads
      DATA_ENCRYPTION_KEY: "${DATA_ENCRYPTION_KEY:?DATA_ENCRYPTION_KEY is required}"
    volumes:
      - uploads:/data/uploads
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - internal

  # ── BullMQ worker + scheduler (same image, overridden entrypoint) ──
  worker:
    logging: *logging
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/rodnapamet/agri-saas:latest
    container_name: agrent-worker
    restart: always
    # Matches `app`, for a different reason: this process owns its own SIGTERM
    # handler (`scripts/worker.ts`) and answers it with `worker.close()`, which
    # BullMQ implements as "stop taking new jobs, finish the ones in hand". A
    # soil-pipeline job calling SoilGrids is not reliably 10 seconds of work,
    # and a job SIGKILLed after its side effects but before its completion is
    # the one that gets retried.
    #
    # Whether that happens today is NOT knowable yet: the line that would say
    # so, `worker shut down gracefully`, comes from worker.ts's own pino
    # instance, which omits `requestId` and is therefore dropped by this VM's
    # ops-agent content filter (#2101). Set on the mechanism's merits; #2101 is
    # what makes the measurement possible afterwards.
    stop_grace_period: 30s
    labels:
      - com.centurylinklabs.watchtower.enable=true
    entrypoint: ["/bin/sh", "-c"]
    # P1.8 — wait for the schema BEFORE consuming jobs.
    #
    # This container overrides the image ENTRYPOINT, which is where
    # `prisma migrate deploy` lives, so it has never waited for a migration.
    # `depends_on` waits for pgbouncer/redis HEALTH, and a healthy database is
    # not a migrated one — Watchtower recreates app and worker together, so on
    # a deploy carrying a migration the worker could consume jobs against the
    # old schema while the app was still applying it.
    command:
      - "./scripts/wait-for-migrations.sh && node dist/scheduler.mjs && node dist/worker.mjs"
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-inflect}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB:-agrent_production}?schema=public&pgbouncer=true
      DIRECT_DATABASE_URL: postgresql://${POSTGRES_USER:-inflect}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-agrent_production}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      STORAGE_PROVIDER: local
      # #1811 — `strict` is the DEFAULT here and in src/env.ts, so an operator
      # has to opt OUT of scanning rather than into it. It was a hardcoded
      # `disabled` in this file, which silently overrode the .env value: a
      # compose `environment:` entry beats `env_file`, so setting
      # AV_SCAN_MODE=strict in /opt/agrent/.env changed nothing. The process
      # env is the only place that tells you which won.
      AV_SCAN_MODE: ${AV_SCAN_MODE:-strict}
      # Explicit, so the app -> clamav wiring is visible beside the service
      # that provides it. clamd's port, on the internal network, never published.
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav:3310}
      # P1.8 — the VM's own Redis, so budgets survive a deploy.
      # "memory" kept every counter in-process, and Watchtower
      # recreates this container on each image push.
      RATE_LIMIT_MODE: redis
      FILE_STORAGE_ROOT: /data/uploads
      UPLOAD_DIR: /data/uploads
      DATA_ENCRYPTION_KEY: "${DATA_ENCRYPTION_KEY:?DATA_ENCRYPTION_KEY is required}"
    volumes:
      - uploads:/data/uploads
    # Proves the worker is CONSUMING, not merely running (#809). This service
    # had no healthcheck at all, so `docker inspect` reported health=none while
    # app/db/pgbouncer/redis reported healthy — and a wedged worker (blocked
    # event loop, dead Redis connection, every concurrency slot held by a hung
    # handler) keeps its container `running` with the web tier green.
    #
    # The probe READS a Redis key that worker.ts refreshes from BullMQ's
    # `completed` event, so a pass means a job was pulled, run and returned. It
    # enqueues nothing: a probe that created work would pass while the worker's
    # own consumption was dead, testing Redis instead of the worker.
    #
    # start_period covers the slowest legitimate cold start: scheduler.mjs runs
    # to completion, worker.mjs subscribes, and the `health-check` repeatable
    # (every 2 min) fires and completes. The key's TTL is 8 min — four missed
    # beats — so retries here are about transient Redis blips, not staleness.
    healthcheck:
      test: ["CMD-SHELL", "node dist/worker-healthcheck.mjs || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 300s
    networks:
      - internal

  # ── Watchtower — auto-deploy from GHCR ──
  # Polls ghcr.io/rodnapamet/agri-saas:latest every 5 min and, on a
  # new digest, pulls + recreates ONLY the labelled containers (app + worker).
  # GHCR pull creds come from the host docker config, mounted read-only. On
  # recreate the app entrypoint runs `prisma migrate deploy`, so schema
  # migrations self-apply. --cleanup removes the superseded image after update.
  watchtower:
    logging: *logging
    image: containrrr/watchtower:latest
    container_name: agrent-watchtower
    restart: always
    # containrrr/watchtower defaults to Docker API client 1.25, which this
    # daemon (API 1.55) rejects (min 1.40). Pin a version in the daemon's
    # supported range.
    environment:
      DOCKER_API_VERSION: "1.44"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/.docker/config.json:/config.json:ro
    # `--stop-timeout 30s` is the other half of the drain and must agree with
    # the two `stop_grace_period` settings above — see the note on `app`.
    #
    # On the `command` line, where the other three flags already live, rather
    # than as `WATCHTOWER_STOP_TIMEOUT`: the image reads both, and splitting
    # four settings across two mechanisms is how one of them gets missed.
    command: --label-enable --cleanup --interval 300 --stop-timeout 30s
    networks:
      - internal

  # ── Caddy (TLS + reverse proxy) ──
  caddy:
    logging: *logging
    image: caddy:2-alpine
    container_name: agrent-caddy
    restart: always
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - internal

  # ── ClamAV (P6.2, #1811) — virus scanning for uploaded files ─────
  #
  # Production ran with `AV_SCAN_MODE=disabled`, no `CLAMAV_HOST` and no
  # container. That is not a flag state: `scanBuffer()` in
  # src/lib/storage/av-scan.ts returns `status: 'CLEAN', engine: 'disabled'`
  # when the host is unset, so every upload across ~8 routes (account avatar,
  # task evidence, journal files, spatial import, grain invoices, evidence
  # uploads and imports) was recorded as scanned-and-clean without being
  # scanned. The module's own docblock calls that mode "dev/test only" and
  # src/env.ts defaults to `strict`; production had overridden it.
  #
  # Mirrors the working service on inflect-compliance: same image, same
  # definitions volume, same healthcheck script.
  #
  # `start_period: 180s` is not padding. clamd loads its full signature
  # database before it answers, which takes minutes on a cold volume — and
  # `AV_SCAN_MODE=strict` BLOCKS uploads while the scanner is unreachable, so
  # flipping the mode before this reports healthy would break working upload
  # paths. Order: start clamav, wait for healthy, verify a scan, then flip.
  #
  # No ports published. Only the app and worker talk to it, over the internal
  # network on clamd's 3310.
  clamav:
    logging: *logging
    image: clamav/clamav:1.4
    restart: unless-stopped
    volumes:
      - clamav-defs:/var/lib/clamav
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  pgdata:
    name: agrent-pgdata
  redisdata:
    name: agrent-redisdata
  uploads:
    name: agrent-uploads
  caddy-data:
    name: agrent-caddy-data
  clamav-defs:
    driver: local
  caddy-config:
    name: agrent-caddy-config
