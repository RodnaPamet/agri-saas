# ───────────────────────────────────────────────────────────────
#  Dependabot — automated dependency updates
# ───────────────────────────────────────────────────────────────
version: 2
updates:
  # ── npm (weekly) ──
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Sofia
    open-pull-requests-limit: 10
    reviewers:
      - h0mele55
    labels:
      - dependencies
      - automated
    # Group updates to reduce PR noise.
    #
    # `applies-to` controls scope:
    #   • omitted          → version-updates only (the default)
    #   • security-updates → CVE-triggered security PRs only
    # A group can target ONE of those; we deliberately keep
    # version-update groups and security-update groups SEPARATE
    # so the weekly version cadence and the on-demand security
    # cadence don't interleave into one PR (mixing routine bumps
    # with urgent CVE fixes makes the review window worse for
    # both).
    groups:
      # ── Version updates (weekly cadence) ──
      # Production deps — review carefully
      #
      # `next` is deliberately EXCLUDED so it lands as its own PR.
      # We carry `patches/next+16.2.11.patch` (825 KB, 6 files) via
      # patch-package, re-injecting the CSP `nonce` that Next's
      # `createComponentStylesAndScripts` still omits — verified still
      # absent upstream in 16.3.1. A Next bump restructures those files,
      # the patch stops applying, and `postinstall` fails.
      #
      # Grouped, that turned one blocked package into a blocked BATCH:
      # PR #572 bundled 26 production deps and every one of them was held
      # hostage by the Next patch. Ungrouped, the rest flow weekly and the
      # Next bump waits for a patch refresh on its own.
      #
      # Remove this exclusion once the nonce fix is upstream and the patch
      # is deleted — not before.
      #
      # The pattern is EXACT (no wildcard), so it excludes `next` only.
      # `next-auth` and `next-intl` are production deps too and stay in
      # the group; writing `next*` here would silently drop both.
      production:
        dependency-type: production
        exclude-patterns:
          - "next"
        update-types:
          - minor
          - patch
      # The typescript-eslint family moves as ONE UNIT or not at all.
      #
      # `typescript-eslint` is a meta-package that pins its siblings to EXACT
      # versions — at 8.71.0 it requires @typescript-eslint/parser@8.71.0,
      # /eslint-plugin@8.71.0, /utils@8.71.0 and /typescript-estree@8.71.0 —
      # while @typescript-eslint/eslint-plugin separately declares a PEER on
      # parser@^<its own version>. Bumping one member without the meta-package
      # is therefore not merely untidy, it is unresolvable by construction:
      #
      #     ERESOLVE could not resolve
      #     peer @typescript-eslint/parser@"^8.70.1"
      #       from @typescript-eslint/eslint-plugin@8.70.1
      #
      # Measured 2026-09-29. The `dev-dependencies` group below matches by
      # `dependency-type: development` with no patterns, which selects the
      # family but cannot guarantee it moves together — #1150 bumped
      # eslint-plugin 8.69.0 -> 8.70.1 and left `typescript-eslint` at ^8.70.0.
      # `npm ci` then failed, so ALL 15 jobs went red on ONE broken install,
      # and the 15 unrelated dev updates in that PR were blocked by it.
      # `@dependabot recreate` reproduced the same split into #1152, which is
      # how we know it is structural and not a stale branch.
      #
      # A dedicated group fixes both halves: the family is bumped as a unit so
      # it resolves, and it is ISOLATED, so if it ever cannot resolve it fails
      # in its own PR instead of holding the weekly dev batch hostage — the
      # same reasoning the `next` exclusion above is built on.
      #
      # ORDER MATTERS: a dependency joins the FIRST group whose patterns match,
      # so this must stay ABOVE `dev-dependencies`. Moving it below silently
      # restores the old behaviour with no error anywhere.
      typescript-eslint:
        patterns:
          - "typescript-eslint"
          - "@typescript-eslint/*"
        update-types:
          - minor
          - patch
      # Dev deps — lower risk
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      # Major versions — always individual PRs (handled by default)

      # ── Security updates (on-demand, CVE-triggered) ──
      # Without these groups, Dependabot opens one PR per advisory.
      # During a widespread advisory wave (semver, axios, xml2js,
      # etc.) that can mint 15+ PRs in an afternoon. Grouped
      # security updates collapse them into one PR per dependency-
      # type, so reviewers see the whole batch in one diff and CI
      # gates (typecheck + build + jest + Trivy + CodeQL + npm
      # audit) cover the bundle as a unit.
      production-security:
        applies-to: security-updates
        dependency-type: production
        patterns:
          - "*"
      dev-security:
        applies-to: security-updates
        dependency-type: development
        patterns:
          - "*"
    # Ignore known-noisy packages
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-patch"]
      # @tanstack/react-table v9 is a REWRITE, not a bump, and needs a
      # planned migration rather than a dependency PR (#575, closed).
      #   - root exports drop `useReactTable` and `getCoreRowModel`
      #     entirely; v9 exposes `useTable` / `createTableHook`
      #   - `ColumnMeta` gains a third generic (TFeatures), so both our
      #     augmentations stop merging — src/types/tanstack-table.d.ts
      #     and src/components/ui/table/mobile-card-list.tsx
      #   - v9's root `useTable` collides with our own export at
      #     src/components/ui/table/table.tsx:136
      # `<DataTable>` is mandated for every list page (Epic 52) and
      # virtualized with a bespoke keyboard layer (Epic 68): 199
      # `meta.mobileCard` references across 40 files, with ~19k lines of
      # guards and rendered tests behind the platform.
      #
      # PATCH AND MINOR ON 8.x STILL COME THROUGH — only the major is
      # held. Remove this entry as part of the migration, not before.
      - dependency-name: "@tanstack/react-table"
        update-types: ["version-update:semver-major"]
      # conventional-changelog-conventionalcommits v10 requires
      # conventional-changelog-writer@9+, and BOTH semantic-release plugins
      # we use (@semantic-release/commit-analyzer, /release-notes-generator)
      # pin writer ^8. Taking v10 therefore breaks `Release` — which it did:
      # merged in a dev-deps group on 2026-08-24, Release failed on main for
      # three consecutive runs, and #759 pinned the preset back to ^9.3.1.
      #
      # The failure is INVISIBLE ON THE PR. `Release` only runs on push to
      # main, so a bump of this package goes green through every check and
      # breaks after merge — which is how it got in the first time, and why
      # an ignore is the right instrument rather than review discipline.
      #
      # PATCH AND MINOR ON 9.x STILL COME THROUGH. Lift this when the
      # semantic-release plugins accept writer@9, not before.
      - dependency-name: "conventional-changelog-conventionalcommits"
        update-types: ["version-update:semver-major"]

  # ── GitHub Actions (monthly) ──
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    reviewers:
      - h0mele55
    labels:
      - dependencies
      - ci
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
