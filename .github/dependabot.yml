# ───────────────────────────────────────────────────────────────
#  Dependabot — automated dependency updates
# ───────────────────────────────────────────────────────────────
version: 2
updates:
  # ── npm (weekly) ──
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Sofia
    open-pull-requests-limit: 10
    reviewers:
      - h0mele55
    labels:
      - dependencies
      - automated
    # Group updates to reduce PR noise.
    #
    # `applies-to` controls scope:
    #   • omitted          → version-updates only (the default)
    #   • security-updates → CVE-triggered security PRs only
    # A group can target ONE of those; we deliberately keep
    # version-update groups and security-update groups SEPARATE
    # so the weekly version cadence and the on-demand security
    # cadence don't interleave into one PR (mixing routine bumps
    # with urgent CVE fixes makes the review window worse for
    # both).
    groups:
      # ── Version updates (weekly cadence) ──
      # Production deps — review carefully
      #
      # `next` is deliberately EXCLUDED so it lands as its own PR.
      # We carry `patches/next+16.2.11.patch` (825 KB, 6 files) via
      # patch-package, re-injecting the CSP `nonce` that Next's
      # `createComponentStylesAndScripts` still omits — verified still
      # absent upstream in 16.3.1. A Next bump restructures those files,
      # the patch stops applying, and `postinstall` fails.
      #
      # Grouped, that turned one blocked package into a blocked BATCH:
      # PR #572 bundled 26 production deps and every one of them was held
      # hostage by the Next patch. Ungrouped, the rest flow weekly and the
      # Next bump waits for a patch refresh on its own.
      #
      # Remove this exclusion once the nonce fix is upstream and the patch
      # is deleted — not before.
      #
      # The pattern is EXACT (no wildcard), so it excludes `next` only.
      # `next-auth` and `next-intl` are production deps too and stay in
      # the group; writing `next*` here would silently drop both.
      production:
        dependency-type: production
        exclude-patterns:
          - "next"
        update-types:
          - minor
          - patch
      # Dev deps — lower risk
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      # Major versions — always individual PRs (handled by default)

      # ── Security updates (on-demand, CVE-triggered) ──
      # Without these groups, Dependabot opens one PR per advisory.
      # During a widespread advisory wave (semver, axios, xml2js,
      # etc.) that can mint 15+ PRs in an afternoon. Grouped
      # security updates collapse them into one PR per dependency-
      # type, so reviewers see the whole batch in one diff and CI
      # gates (typecheck + build + jest + Trivy + CodeQL + npm
      # audit) cover the bundle as a unit.
      production-security:
        applies-to: security-updates
        dependency-type: production
        patterns:
          - "*"
      dev-security:
        applies-to: security-updates
        dependency-type: development
        patterns:
          - "*"
    # Ignore known-noisy packages
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-patch"]
      # @tanstack/react-table v9 is a REWRITE, not a bump, and needs a
      # planned migration rather than a dependency PR (#575, closed).
      #   - root exports drop `useReactTable` and `getCoreRowModel`
      #     entirely; v9 exposes `useTable` / `createTableHook`
      #   - `ColumnMeta` gains a third generic (TFeatures), so both our
      #     augmentations stop merging — src/types/tanstack-table.d.ts
      #     and src/components/ui/table/mobile-card-list.tsx
      #   - v9's root `useTable` collides with our own export at
      #     src/components/ui/table/table.tsx:136
      # `<DataTable>` is mandated for every list page (Epic 52) and
      # virtualized with a bespoke keyboard layer (Epic 68): 199
      # `meta.mobileCard` references across 40 files, with ~19k lines of
      # guards and rendered tests behind the platform.
      #
      # PATCH AND MINOR ON 8.x STILL COME THROUGH — only the major is
      # held. Remove this entry as part of the migration, not before.
      - dependency-name: "@tanstack/react-table"
        update-types: ["version-update:semver-major"]

  # ── GitHub Actions (monthly) ──
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    reviewers:
      - h0mele55
    labels:
      - dependencies
      - ci
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
