#
# Does main's tip have a published image?
#
# ── The gap this closes (#805, #826) ──
#
# `Publish image to GHCR` carries `cancel-in-progress: true`, so a burst
# of merges cancels the earlier publishes — correct behaviour, since only
# the tip's image matters. The problem is that GitHub reports a SUPERSEDED
# run and a run killed by its own `timeout-minutes` with the same word,
# `cancelled`, and the second kind means the tip may be unpublished.
#
# On 2026-09-08 run 34208631386 was the second kind. It had in fact pushed
# successfully 13 minutes before the timeout killed it, but nothing in the
# repo said so, and two readers of the same run list reached opposite
# conclusions about whether production was stale. Settling it required
# reading 1630 lines of buildx output by hand.
#
# No event-keyed rule can fix that, because the event is genuinely
# ambiguous — which is why `ci-failure-issue.sh` now SUPPRESSES
# ghcr-publish cancellations rather than guessing at them. This workflow
# asks the state question instead, against the registry, and a red run
# here becomes an issue through the notifier, which watches it by name.
#
# It runs after every publish attempt (including cancelled ones — that is
# the point), daily as a backstop, and on demand.
#
name: Image tip check

on:
    workflow_run:
        workflows: ["Publish image to GHCR"]
        types: [completed]
    schedule:
        # Daily. Narrows the blind window to <= 24h for anything that slips
        # past the per-publish run (a cancelled workflow_run trigger, a
        # registry hiccup, or a tag deleted out of band).
        - cron: "0 8 * * *"
    workflow_dispatch:

permissions:
    contents: read
    packages: read

concurrency:
    group: image-tip-check
    # Never cancel this one. A cancelled state check is a state check that
    # did not run, which is the failure mode the whole file exists to avoid.
    cancel-in-progress: false

jobs:
    check:
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  # Always ask about main's tip, never about the ref that
                  # happened to trigger this run.
                  ref: main

            - name: Log in to GHCR
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: "Does main's tip have a published image?"
              env:
                  REPO: ${{ github.repository }}
              run: |
                  TIP_SHA="$(git rev-parse HEAD)"
                  echo "main tip: $TIP_SHA"
                  TIP_SHA="$TIP_SHA" REPO="$REPO" bash .github/scripts/image-tip-check.sh
