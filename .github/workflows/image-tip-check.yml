#
# Does main's tip have a published image?
#
# ── The gap this closes (#805, #826) ──
#
# `Publish image to GHCR` supersedes publishes during a burst — with
# `cancel-in-progress: false` since #877 it drops the ones still PENDING
# instead of the one executing, but either way earlier runs die, since only
# the tip's image matters. The problem is that GitHub reports a SUPERSEDED
# run and a run killed by its own `timeout-minutes` with the same word,
# `cancelled`, and the second kind means the tip may be unpublished.
#
# On 2026-09-08 run 34208631386 was the second kind. It had in fact pushed
# successfully 13 minutes before the timeout killed it, but nothing in the
# repo said so, and two readers of the same run list reached opposite
# conclusions about whether production was stale. Settling it required
# reading 1630 lines of buildx output by hand.
#
# No event-keyed rule can fix that, because the event is genuinely
# ambiguous — which is why `ci-failure-issue.sh` now SUPPRESSES
# ghcr-publish cancellations rather than guessing at them. This workflow
# asks the state question instead, against the registry, and a red run
# here becomes an issue through the notifier, which watches it by name.
#
# It runs after every publish attempt (including cancelled ones — that is
# the point), daily as a backstop, and on demand.
#
name: Image tip check

on:
    workflow_run:
        workflows: ["Publish image to GHCR"]
        types: [completed]
    schedule:
        # Daily. Narrows the blind window to <= 24h for anything that slips
        # past the per-publish run (a cancelled workflow_run trigger, a
        # registry hiccup, or a tag deleted out of band).
        - cron: "0 8 * * *"
    workflow_dispatch:

permissions:
    contents: read
    packages: read
    # Needed to ask whether the tip's own publish is queued or running. Without
    # it the gate cannot tell "a run is coming" from "nothing is coming", and
    # deferring on that unknown is what let #877 go unreported for three hours.
    actions: read

concurrency:
    group: image-tip-check
    # Never cancel this one. A cancelled state check is a state check that
    # did not run, which is the failure mode the whole file exists to avoid.
    cancel-in-progress: false

jobs:
    check:
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  # Always ask about main's tip, never about the ref that
                  # happened to trigger this run.
                  ref: main
                  # REQUIRED, not hygiene. Both steps below find the newest
                  # PUBLISHABLE commit with `git log --invert-grep`, which has
                  # to walk BACK past `[skip ci]` release commits. The default
                  # depth of 1 leaves exactly one commit in the clone, so when
                  # the tip IS a release commit the filter excludes it, finds
                  # nothing, and returns empty — which is precisely the case
                  # the filter was added for. It worked only when not needed.
                  # Broke on 3.5.18 (run 34477622790, issue #869).
                  fetch-depth: 0

            - name: Log in to GHCR
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # ── Is this the TIP's own publish? (#845) ──
            #
            # `workflow_run` fires on ANY completion of the publish workflow,
            # and a merge burst supersedes older runs — before #877 the one
            # executing, now the one still pending. Either cancellation fires
            # this workflow, which then asks about main's CURRENT tip — whose
            # own publish is, by construction, still building or queued.
            #
            # Measured on the very first run: run 34374961023 (c38cd3525) was
            # cancelled at 16:16 when 34375694143 (8029f92f9) started; this
            # check woke at 16:17 and correctly reported that 8029f92 had no
            # image, because its build was at step 6 of 11. A true statement,
            # asked too early — the trigger cannot tell "the tip's publish
            # finished" from "an older publish died while the tip's runs".
            #
            # So: only ask when the run that triggered us was FOR the tip. Any
            # other commit's publish is either superseded (its successor will
            # trigger us again) or already answered. A cancelled publish for
            # the tip still reaches the check, which is the case this file
            # exists for. The daily cron is the backstop for anything missed.
            - name: "Is this the tip's own publish?"
              id: gate
              if: github.event_name == 'workflow_run'
              env:
                  TRIGGERING_SHA: ${{ github.event.workflow_run.head_sha }}
                  REPO: ${{ github.repository }}
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -euo pipefail
                  TARGET="$(git log -1 --format=%H --invert-grep --grep='\[skip ci\]')"
                  # An empty answer is not an answer. Without this, the
                  # comparison below is trivially true and the step sets
                  # skip=true — silently retiring the whole check.
                  if [ -z "$TARGET" ]; then
                      echo "::error::No publishable commit found in the clone. Every commit reachable here carries the CI-skip marker, which means the checkout is too shallow (needs fetch-depth: 0)."
                      exit 1
                  fi
                  # The decision lives in a script so it can be tested. It
                  # used to be four lines here and it was wrong in a way no
                  # test could have caught, because there was no test. See
                  # .github/scripts/image-tip-gate.sh and #877.
                  TARGET="$TARGET" TRIGGERING_SHA="$TRIGGERING_SHA" REPO="$REPO" \
                      bash .github/scripts/image-tip-gate.sh

            # ── Ask about the newest PUBLISHABLE commit, not literally HEAD ──
            #
            # semantic-release pushes `chore(release): X [skip ci]`, and GitHub
            # suppresses workflow runs for `[skip ci]` commits — so a release
            # commit NEVER gets a ghcr-publish run and can never have an image.
            # Measured over the last 14 commits on main: 4 are release commits,
            # all 4 have zero publish runs, all 10 others have one. main's tip
            # was 5cabfc19a (3.5.10) when this was written.
            #
            # Asking about HEAD therefore fails 100% of the time after every
            # release, permanently, until the next feature commit — not a race,
            # a false premise. The question that means something is whether the
            # newest commit that WOULD be published has been.
            #
            # (That the release commit's own version bump never reaches an image
            # is a separate, pre-existing property of this repo's release flow.
            # It is not this check's to assert on, and inventing a failure for it
            # here would be the same error in the other direction.)
            - name: "Does the publishable tip have an image?"
              if: steps.gate.outputs.skip != 'true'
              env:
                  REPO: ${{ github.repository }}
              run: |
                  set -euo pipefail
                  TIP_SHA="$(git log -1 --format=%H --invert-grep --grep='\[skip ci\]')"
                  if [ -z "$TIP_SHA" ]; then
                      echo "::error::No publishable commit found in the clone. Every commit reachable here carries the CI-skip marker, which means the checkout is too shallow (needs fetch-depth: 0)."
                      exit 1
                  fi
                  HEAD_SHA="$(git rev-parse HEAD)"
                  if [ "$TIP_SHA" != "$HEAD_SHA" ]; then
                      echo "main HEAD is ${HEAD_SHA:0:9} ($(git log -1 --format=%s "$HEAD_SHA")) — not publishable"
                  fi
                  echo "publishable tip: $TIP_SHA"
                  TIP_SHA="$TIP_SHA" REPO="$REPO" bash .github/scripts/image-tip-check.sh
