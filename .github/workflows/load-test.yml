name: Load Test (k6)

# Load tests are expensive (full app boot + sustained traffic), so we
# run them on-demand via workflow_dispatch rather than on every PR.
# Triggers:
#   - manual: pick a scenario + VU count from the Actions UI
#   - nightly main: trend-tracking baseline (smoke level — 25 VUs, 1m)
on:
  workflow_dispatch:
    inputs:
      scenario:
        type: choice
        description: Scenario to run
        options:
          - both
          - auth
          - lists
          - streams
          - delivery
        default: both
      vus:
        description: Virtual users (concurrency target)
        default: '50'
      duration:
        description: Sustained duration (e.g. 2m, 5m)
        default: '2m'
  schedule:
    # 03:30 UTC daily — light smoke baseline on main for trend tracking.
    # Doesn't block anything; alerts via the artifact diff if budgets drift.
    - cron: '30 3 * * *'

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        # Pin repeated from .github/postgis-image, the single source of
        # truth: `services.<id>.image` accepts no `env` context, so it
        # cannot read one. `tests/guards/postgis-image-single-source.test.ts`
        # fails CI if this literal and that file disagree (#860).
        image: postgres:16-trixie
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ci_testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci_testdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ci:ci_password@localhost:5432/ci_testdb?schema=public&pgbouncer=true
      DIRECT_DATABASE_URL: postgresql://ci:ci_password@localhost:5432/ci_testdb?schema=public
      REDIS_URL: redis://localhost:6379
      AUTH_TEST_MODE: '1'
      RATE_LIMIT_ENABLED: '0'
      AUTH_SECRET: ci-load-test-secret-do-not-use-in-prod
      NEXTAUTH_URL: http://localhost:3006
      NEXTAUTH_SECRET: ci-load-test-secret-do-not-use-in-prod
      DATA_ENCRYPTION_KEY: ci-load-test-data-encryption-key-32b
      # NODE_ENV intentionally NOT set at the job level. Setting it
      # to "production" here causes `npm ci` to skip
      # devDependencies — which includes `patch-package`. The
      # repo's `postinstall` hook then invokes `patch-package`,
      # can't find it on PATH, and exits 127. The Build + Start
      # steps below set NODE_ENV=production inline so the app
      # still runs as a production build.
      PORT: '3006'
      SKIP_ENV_VALIDATION: '1'

    steps:
      - uses: actions/checkout@v7

      # Use the shared composite action rather than hand-rolling setup. It
      # runs `npm ci` AND `prisma generate`, both with the Roadmap-27 retry
      # hardening. This workflow previously duplicated only the npm-ci half,
      # so `npm run db:seed` died on `Cannot find module
      # '.prisma/client/default'` — the generated client never existed.
      # Duplicating half of a shared setup is how the halves drift apart.
      - name: Setup Node + Prisma client
        uses: ./.github/actions/setup-node-prisma
        with:
          node-version: '22'

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      # FIRST, because everything scenario-gated below depends on it and it
      # depends on nothing: it reads `inputs` and `github.event_name` only.
      # It used to sit after `Wait for /api/health`, which forced every
      # scenario-gated step below the app boot — and that is what put the DM
      # flag's INSERT after the app had already cached the flag table
      # (30s Redis TTL, one key), so the delivery run read a flag that was on
      # in Postgres and off in the process. Measured on run 42576945583: a
      # 404 from `/api/social/inbox`, which is what a disabled flag answers.
      - name: Pick parameters (manual vs scheduled)
        id: params
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "scenario=${{ inputs.scenario }}" >> "$GITHUB_OUTPUT"
            echo "vus=${{ inputs.vus }}" >> "$GITHUB_OUTPUT"
            echo "duration=${{ inputs.duration }}" >> "$GITHUB_OUTPUT"
          else
            # Nightly smoke — keep it light and fast.
            echo "scenario=both" >> "$GITHUB_OUTPUT"
            echo "vus=25" >> "$GITHUB_OUTPUT"
            echo "duration=1m" >> "$GITHUB_OUTPUT"
          fi

      # k6's handleSummary writes tests/load/results/<scenario>-summary.json.
      # The directory is gitignored (a developer artefact) and nothing created
      # it here, so every run ended with:
      #   failed to handle the end-of-test summary … no such file or directory
      # The run still exited on its thresholds, but the per-step numbers needed
      # to CALIBRATE those thresholds were never written — which is why the
      # login budget has never been checked against a real measurement.
      - name: Enable pgvector (PGDG)
        uses: ./.github/actions/enable-pgvector

      # ── Create roles required by RLS migrations ──
      # Mirrors the identical step in ci.yml's DB-backed jobs. Without it
      # `prisma migrate deploy` dies on the first RLS migration with
      # `ERROR: role "app_user" does not exist` (SQLSTATE 42704), because the
      # tenant-isolation policies GRANT to app_user and a fresh service
      # container has no such role. This job has never had the step, so its
      # migrations have always failed — the load scenarios below never ran.
      - name: Create PostgreSQL roles for RLS
        run: |
          PGPASSWORD=ci_password psql -h localhost -U ci -d ci_testdb <<'SQL'
          DO $$ BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'app_user') THEN CREATE ROLE app_user NOLOGIN; END IF;
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'postgres') THEN CREATE ROLE postgres NOLOGIN; END IF;
          END $$;
          GRANT app_user TO ci;
          GRANT app_user TO postgres;
          SQL

      - name: Apply migrations + seed
        run: |
          npx prisma migrate deploy
          npm run db:seed

      # The DM flag is switched on HERE rather than by the seeder, which reads
      # it and refuses to write it: enabling a second global flag is an
      # operator decision, not a side effect of seeding. On a throwaway CI
      # database that decision is this line.
      #
      # BEFORE `Build app` / `Start app`, and that is the fix for run
      # 42576945583. The flag table is cached in Redis for 30s under ONE key,
      # so a process that read it before the INSERT serves the pre-insert
      # answer for up to half a minute — and `assertFeatureEnabled` answers a
      # disabled flag with 404, deliberately, so the surface is not advertised
      # before it is built. The run therefore failed on a flag that was ON in
      # Postgres and OFF in the app, which is the hardest version of this to
      # diagnose from either side alone. Writing it before anything boots
      # removes the window rather than waiting one out.
      - name: Enable social.direct-messages (delivery scenario)
        if: steps.params.outputs.scenario == 'delivery'
        run: |
          PGPASSWORD=ci_password psql -h localhost -U ci -d ci_testdb <<'SQL'
          INSERT INTO "FeatureFlag" ("id", "key", "enabled", "cohorts", "description", "createdAt", "updatedAt")
          VALUES (gen_random_uuid()::text, 'social.direct-messages', true, '{}',
                  'Enabled by load-test.yml for the #2881 delivery run.', NOW(), NOW())
          ON CONFLICT ("key") DO UPDATE SET "enabled" = true, "cohorts" = '{}', "updatedAt" = NOW();
          SQL

      - name: Build app
        env:
          NODE_ENV: production
        run: npm run build

      - name: Start app (background)
        env:
          NODE_ENV: production
        run: |
          npm start > /tmp/app.log 2>&1 &
          echo $! > /tmp/app.pid

      - name: Wait for /api/health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3006/api/health > /dev/null 2>&1; then
              echo "App is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "App failed to start within 60s. Last 100 lines of log:"
          tail -n 100 /tmp/app.log || true
          exit 1

      # ── k6 WITH the SSE extension, for the delivery scenario (#2881) ──
      #
      # IT SITS AFTER `Pick parameters`, NOT BESIDE `Setup k6`, and that is not
      # tidiness. Its `if` reads `steps.params.outputs.scenario`, and a step
      # whose condition references an output produced LATER evaluates against
      # an empty string — so the step is SKIPPED, silently, and the only
      # symptom is the next step failing on a missing file. Measured on run
      # 42574529418: the build was skipped and `Run k6 — delivery` died in two
      # seconds on `./k6-sse`. `tests/guards/workflow-step-outputs-are-ordered.test.ts`
      # now derives that rule across every workflow.
      #
      # Stock k6 cannot read frames from a held response: `http.get` on an SSE
      # endpoint blocks until the request times out, so a VU that opened a
      # stream could not also write into it. P8.9's criterion is DELIVERY —
      # write to frame — and measuring it needs a client that reads while the
      # VU stays in the event loop. That is `xk6-sse`, and a binary carrying it
      # has to be built.
      #
      # Built only for the scenario that needs it, so the other three keep the
      # stock action's cached binary and pay nothing. The build is ~1 min on a
      # runner that already has Go preinstalled — no `setup-go` step, which is
      # one fewer action to pin.
      #
      # `./k6-sse` rather than overwriting `k6` on PATH: the two binaries are
      # not interchangeable in the direction that matters. A scenario run under
      # the WRONG one should fail at the `k6/x/sse` import rather than silently
      # measure something else, and keeping them as separate paths is what makes
      # that true by construction.
      #
      # The extension is PINNED by commit, not by a floating default branch:
      # `xk6 build` with no version pulls whatever HEAD happens to be, which
      # makes the measurement irreproducible and the build a supply-chain edge
      # nobody reviewed.
      - name: Build k6 with xk6-sse (delivery scenario)
        if: steps.params.outputs.scenario == 'delivery'
        env:
          # `K6_VERSION` is READ BY xk6 ITSELF, not just by this script.
          # Measured on run 42575556014: setting it here AND passing the same
          # value as a positional argument fails with `k6 version was
          # specified with both flag and argument` — after four minutes of
          # module downloads, so the failure is slow as well as opaque. The
          # version lives in exactly one place now, and it is this variable
          # because that is the one xk6 consumes.
          # THE EXTENSION AND k6 ARE A COUPLED PAIR, and pinning one without
          # the other is the failure. Measured from the module proxy rather
          # than guessed, after run 42576244555 failed with the uninformative
          # `resolving dependency: executing go command: exit status 1`:
          #
          #   xk6-sse v0.1.2   -> go.k6.io/k6     v0.51.0
          #   xk6-sse v0.1.12  -> go.k6.io/k6     v1.2.1
          #   xk6-sse v0.2.0   -> go.k6.io/k6/v2  v2.0.0
          #
          # So the version below is not "the latest k6" — it is the version
          # THIS extension declares, which is the only pairing its author
          # built against. Moving either line means re-reading
          # `https://proxy.golang.org/github.com/phymbert/xk6-sse/@v/<v>.mod`
          # and moving the other to match.
          K6_VERSION: v2.0.0
          XK6_SSE: github.com/phymbert/xk6-sse@v0.2.0
        run: |
          go version
          go install go.k6.io/xk6/cmd/xk6@latest
          "$(go env GOPATH)/bin/xk6" build --with "$XK6_SSE" --output ./k6-sse
          ./k6-sse version
          # A POSITIVE CONTROL on the build, not just on the binary existing:
          # a k6 without the extension exits non-zero on this import, so a
          # silently-stock binary cannot reach the scenario below.
          printf 'import sse from "k6/x/sse";\nexport default function(){};\n' > /tmp/sse-probe.js
          ./k6-sse run --quiet --vus 1 --iterations 1 /tmp/sse-probe.js
          echo "xk6-sse resolves in ./k6-sse"

      - name: Create k6 results directory
        run: mkdir -p tests/load/results

      - name: Run k6 — auth scenario
        if: steps.params.outputs.scenario == 'auth' || steps.params.outputs.scenario == 'both'
        run: |
          k6 run \
            -e VUS=${{ steps.params.outputs.vus }} \
            -e DURATION=${{ steps.params.outputs.duration }} \
            tests/load/auth.js

      - name: Run k6 — lists scenario
        if: steps.params.outputs.scenario == 'lists' || steps.params.outputs.scenario == 'both'
        run: |
          k6 run \
            -e VUS=${{ steps.params.outputs.vus }} \
            -e DURATION=${{ steps.params.outputs.duration }} \
            tests/load/lists.js

      # ── streams scenario (#1999) ───────────────────────────────────────
      #
      # Two steps rather than one, because this scenario needs ONE ACCOUNT PER
      # VU: `/api/me/stream` caps streams at three per person, so the shape the
      # other scenarios use (N VUs, one login) would hold three streams and
      # take N-3 refusals. The seeder also enables `notifications.sse`, which
      # is default-OFF — without it every stream answers 204 and k6 would
      # report a vacuous pass on an empty metric.
      #
      # This runs at the nightly's 25 VUs, which is NOT the criterion's
      # thousand — #1999 says the throwaway VM for that, and a 2-vCPU shared
      # runner cannot produce a number worth recording. What it is for is the
      # failure this directory's guard was written about: `lists.js` sat broken
      # for months because nothing executed it. 25 VUs a night proves the
      # script, the seeder and the login flow still work.
      - name: Seed per-VU stream accounts (streams scenario)
        if: steps.params.outputs.scenario == 'streams' || steps.params.outputs.scenario == 'both'
        env:
          LOAD_SEED_CONFIRM: yes-this-is-a-throwaway-vm
          LOAD_TEST_PASSWORD: ci_load_password
        run: |
          npx tsx scripts/seed-load-streams.ts \
            --users ${{ steps.params.outputs.vus }} \
            --enable-flag

      - name: Run k6 — streams scenario
        if: steps.params.outputs.scenario == 'streams' || steps.params.outputs.scenario == 'both'
        env:
          BASE_URL: http://localhost:3006
          LOAD_TEST_PASSWORD: ci_load_password
        run: |
          k6 run \
            -e VUS=${{ steps.params.outputs.vus }} \
            -e DURATION=${{ steps.params.outputs.duration }} \
            -e RAMP_UP=20s \
            -e RAMP_DOWN=10s \
            -e STREAM_HOLD=15s \
            tests/load/realtime-streams.js

      # ── delivery scenario (#2881) ──────────────────────────────────────
      #
      # PAIRS accounts in pairs, each with an ACCEPTED conversation, so one VU
      # can hold a stream as A and write as B. `--pairs` needs two accounts per
      # pair, which is why `--users` is twice it.
      #
      # Deliberately small (25 pairs) rather than matching the streams
      # scenario's thousand: this measures a LATENCY, and a thousand
      # simultaneous writes on a CI runner would measure the runner. The
      # concurrency question is `realtime-streams.js`'s and is already answered
      # there.
      - name: Seed DM pairs (delivery scenario)
        if: steps.params.outputs.scenario == 'delivery'
        env:
          LOAD_SEED_CONFIRM: yes-this-is-a-throwaway-vm
          LOAD_TEST_PASSWORD: ci_load_password
        run: |
          npx tsx scripts/seed-load-streams.ts \
            --users $(( ${{ steps.params.outputs.vus }} * 2 )) \
            --pairs ${{ steps.params.outputs.vus }} \
            --enable-flag

      - name: Run k6 — delivery scenario
        if: steps.params.outputs.scenario == 'delivery'
        env:
          BASE_URL: http://localhost:3006
          LOAD_TEST_PASSWORD: ci_load_password
        run: |
          ./k6-sse run \
            -e PAIRS=${{ steps.params.outputs.vus }} \
            -e DURATION=${{ steps.params.outputs.duration }} \
            -e RAMP_UP=20s \
            -e RAMP_DOWN=10s \
            tests/load/realtime-delivery.js

      - name: Stop app
        if: always()
        run: |
          if [ -f /tmp/app.pid ]; then
            kill "$(cat /tmp/app.pid)" 2>/dev/null || true
          fi

      - name: Upload k6 results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: k6-results-${{ github.run_id }}
          path: |
            tests/load/results/*.json
            /tmp/app.log
          retention-days: 30
