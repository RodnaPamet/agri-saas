# ───────────────────────────────────────────────────────────────
#  Turn a red run that nobody is watching into a GitHub issue.
#
#  ## The problem this exists for
#
#  A failing `pull_request` run is loud: it sits on a PR page somebody
#  opened on purpose. Every OTHER trigger is silent. Measured on this
#  repo before this workflow existed:
#
#    · Terraform "Apply: staging"  — red since 2026-07-02, 50 days
#    · Restore Test                — 2 runs ever, both failed, unnoticed
#    · Load Test (k6)              — a real lists-scenario failure on
#                                    2026-08-10 sat unexamined until it
#                                    was found by hand 11 days later
#    · Coverage                    — `if: github.event_name == 'push'`
#                                    (ci.yml:481), so it can ONLY ever
#                                    go red after a merge
#
#  Three subsystems, one shared failure mode: the signal exists, is
#  correct, and reaches nobody. GitHub's own notification default for
#  this account is "don't notify", and even switched on it covers only
#  runs from pushes you personally made — which is none of the crons.
#
#  ## Why an issue rather than a webhook
#
#  Issues are demonstrably the queue this repo works from. A webhook
#  needs a secret, an external dependency and a destination somebody
#  maintains; an issue needs none of those and lands where triage
#  already happens.
#
#  ## Why this will not become wallpaper
#
#  De-dupe is by EXACT TITLE over `gh issue list --label ci-failure`,
#  not the lagging search index — so a workflow that fails 51 nights
#  running produces ONE issue with 51 comments, not 51 issues. And the
#  success branch closes the issue on the next green run, so a fixed
#  problem stops occupying the queue without anyone tidying up.
#
#  ## Two things the first version got wrong, both caught in production
#
#  Within two minutes of #676 merging, this filed an issue for a
#  CANCELLED `Release` run. A `concurrency` group keeps only the most
#  recent pending run and cancels earlier ones, so four rapid merges to
#  main produced two cancellations — the queue working correctly.
#  `cancelled` is no longer treated as a failure.
#
#  And that issue was then closed by a SUCCESS for an EARLIER commit
#  whose run merely finished later. The body now carries a
#  `ci-failure-run: <id>` high-water mark, and a success only closes
#  when its own run id is greater.
#
#  Both were decision logic, which is why the logic now lives in
#  `.github/scripts/ci-failure-issue.sh` where it can be executed —
#  see `tests/unit/ci-failure-notifier.test.ts`. Logic embedded in
#  workflow YAML cannot be tested, and this is what that costs.
#
#  ## Deliberately NOT watched
#
#  `pull_request` runs (they have a PR page) and `merge_group` runs
#  (they block the queue, which is its own loud signal).
# ───────────────────────────────────────────────────────────────
name: CI failure → issue

on:
  workflow_run:
    workflows:
      - "CI"
      - "Release"
      - "Load Test (k6)"
      - "Restore Test"
      - "Terraform"
      - "Deploy"
      # A scheduled probe is exactly the silent-trigger class this notifier
      # exists for: nobody has a page open when a cron goes red (#781).
      - "Basemap Provenance"
    types: [completed]

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  # Serialise per workflow so two runs of the same workflow finishing
  # together cannot both lose the "does an issue already exist?" race
  # and file duplicates.
  group: ci-failure-issue-${{ github.event.workflow_run.name }}
  cancel-in-progress: false

jobs:
  notify:
    # A pull_request run is already visible on its PR; merge_group
    # failures block the queue. Neither is silent, so neither is ours.
    if: >-
      github.event.workflow_run.event != 'pull_request' &&
      github.event.workflow_run.event != 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the decision script
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: File, comment on, or close the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          WF: ${{ github.event.workflow_run.name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT: ${{ github.event.workflow_run.event }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
        run: ./.github/scripts/ci-failure-issue.sh
