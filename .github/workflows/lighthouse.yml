name: Lighthouse

# Mobile performance budget (390px). Builds + starts the app like the
# load-smoke job, then runs Lighthouse CI against the public /login page on a
# throttled mobile profile and asserts LCP / TBT / CLS budgets (see
# lighthouserc.json). INP is a field-only metric — tracked via web-vitals RUM
# (src/components/pwa/WebVitalsReporter.tsx), not here.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  lighthouse:
    name: "Lighthouse (mobile budget)"
    runs-on: ${{ vars.LARGE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20

    env:
      AUTH_TEST_MODE: "1"
      AUTH_TRUST_HOST: "1"
      AUTH_SECRET: "test-auth-secret-that-is-long-enough-32chars" # pragma: allowlist secret — test-only stub for the Lighthouse CI job
      JWT_SECRET: "test-auth-secret-that-is-long-enough-32chars" # pragma: allowlist secret — test-only stub for the Lighthouse CI job
      AUTH_URL: "http://localhost:3006"
      DATABASE_URL: postgresql://ci:ci_password@localhost:5432/ci_testdb?schema=public
      DATABASE_URL_TEST: postgresql://ci:ci_password@localhost:5432/ci_testdb?schema=public
      DIRECT_DATABASE_URL: postgresql://ci:ci_password@localhost:5432/ci_testdb?schema=public
      REDIS_URL: redis://localhost:6379
      RATE_LIMIT_ENABLED: "0"
      DATA_ENCRYPTION_KEY: ci-test-data-encryption-key-32-chars-or-more-deterministic-x

    services:
      postgres:
        # Pin repeated from .github/postgis-image, the single source of
        # truth: `services.<id>.image` accepts no `env` context, so it
        # cannot read one. `tests/guards/postgis-image-single-source.test.ts`
        # fails CI if this literal and that file disagree (#860).
        image: postgres:16-trixie
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ci_testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci -d ci_testdb"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v7

      - name: Setup environment
        run: cp .env.e2e.example .env

      - name: Setup Node + Prisma client
        uses: ./.github/actions/setup-node-prisma
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Create PostgreSQL roles for RLS
        run: |
          PGPASSWORD=ci_password psql -h localhost -U ci -d ci_testdb <<'SQL'
          DO $$ BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'app_user') THEN CREATE ROLE app_user NOLOGIN; END IF;
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'postgres') THEN CREATE ROLE postgres NOLOGIN; END IF;
          END $$;
          GRANT app_user TO ci;
          GRANT app_user TO postgres;
          SQL

      - name: Enable pgvector (PGDG)
        uses: ./.github/actions/enable-pgvector
      - name: Apply Prisma migrations
        run: ./node_modules/.bin/prisma migrate deploy

      # One public farm profile, so /f/lighthouse renders a real page instead
      # of a 404 (P6.5, #1814). Without it the new budget would measure the
      # not-found page and report a flattering number for a route nobody can
      # reach.
      #
      # Inserted straight into `PublicFarmProfile` rather than through the
      # editor: that table is the PROJECTION — global, no `tenantId`, no RLS —
      # and the public reader queries only it, so a row here is the entire
      # precondition. Going through `FarmBrand` + publish would need a tenant,
      # a membership and an admin context to measure a page that reads none of
      # them.
      #
      # Cyrillic content on purpose. The page's LCP element is its heading, and
      # the Cyrillic glyphs are what the font actually has to deliver — Latin
      # placeholder text would measure a font subset this page never serves.
      # The flag that gates /f/{handle} (#1886). Without it the page 404s,
      # and Lighthouse ERRORS on a non-2xx main document rather than
      # measuring it — `Run #1...failed!` with exit code 1, which is how this
      # was found. `cohorts` is empty on purpose: a flag with cohorts is a
      # limited rollout, and this page is anonymous so there is no user to
      # match one against.
      - name: Enable the public-profile flag
        run: |
          PGPASSWORD=ci_password psql -h localhost -U ci -d ci_testdb <<'SQL'
          INSERT INTO "FeatureFlag" ("key", "enabled", "description", "cohorts", "updatedAt")
          VALUES ('social.public-profile', true, 'Lighthouse budget run', '{}', NOW())
          ON CONFLICT ("key") DO UPDATE SET "enabled" = true;
          SQL

      - name: Seed one public farm profile
        run: |
          PGPASSWORD=ci_password psql -h localhost -U ci -d ci_testdb <<'SQL'
          INSERT INTO "PublicFarmProfile"
            ("handle", "displayName", "tagline", "about", "oblast", "crops", "displayNameLatin", "indexable", "projectedAt")
          VALUES
            ('lighthouse', 'Стопанство Победа', 'Зърно и слънчоглед от Добруджа',
             'Семейно стопанство в Добруджа, трето поколение. Отглеждаме пшеница, слънчоглед и рапица на 1200 декара.',
             'Добрич', ARRAY['пшеница', 'слънчоглед', 'рапица'], 'stopanstvo-pobeda', false, NOW())
          ON CONFLICT ("handle") DO NOTHING;
          SQL

      # The row has to be THERE, not merely inserted without error. An
      # `ON CONFLICT DO NOTHING` reports success for a row it skipped, and a
      # migration that renamed the table would fail the step above loudly —
      # but a silently empty table would leave the budget measuring a 404.
      - name: Verify the seeded profile is readable
        run: |
          COUNT=$(PGPASSWORD=ci_password psql -h localhost -U ci -d ci_testdb -tAc \
            "SELECT count(*) FROM \"PublicFarmProfile\" WHERE handle = 'lighthouse';")
          echo "seeded rows: $COUNT"
          if [ "$COUNT" != "1" ]; then
            echo "::error::/f/lighthouse has no projection row, so the Lighthouse budget would measure a 404."
            exit 1
          fi
          # BOTH preconditions, because either one missing produces the same
          # 404 and the same Lighthouse collection error.
          FLAG=$(PGPASSWORD=ci_password psql -h localhost -U ci -d ci_testdb -tAc \
            "SELECT enabled FROM \"FeatureFlag\" WHERE key = 'social.public-profile';")
          echo "flag enabled: $FLAG"
          if [ "$FLAG" != "t" ]; then
            echo "::error::social.public-profile is not enabled, so /f/lighthouse 404s and Lighthouse cannot measure it."
            exit 1
          fi

      - name: Create upload directory
        run: mkdir -p tmp/test-uploads

      - name: Build Next.js app
        run: npx next build --webpack
        env:
          # `next build` OOMs on the private-repo runners' ~2 GB default heap
          # (exit 134) — lift it as the CI workflow's build/jest jobs do.
          NODE_OPTIONS: --max-old-space-size=8192
          NODE_ENV: production

      - name: Start app (background)
        run: |
          nohup npx next start -p 3006 > /tmp/app.log 2>&1 &
          echo $! > /tmp/app.pid

      - name: Wait for /api/health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3006/api/health > /dev/null 2>&1; then
              echo "App is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::App failed to start within 60s. Last 100 lines of log:"
          tail -n 100 /tmp/app.log || true
          exit 1

      - name: "Gate: Lighthouse mobile budget"
        run: npx --yes @lhci/cli@0.15.1 autorun --config=lighthouserc.json

      # The number behind the verdict (#796).
      #
      # `numberOfRuns: 3` writes three `lhr-<ts>.json` into `.lighthouseci`
      # and nothing ever read them, so the gate could say pass/fail and no one
      # could see the value it judged. That made any performance change
      # un-evidenceable — including the font preload #796 actually asks for.
      #
      # `if: always()` so a FAILED budget still prints its numbers: the run
      # where you most want the metric is the one that just broke.
      - name: Median metrics
        if: always()
        run: node scripts/ci/lighthouse-median.mjs .lighthouseci

      - name: Stop app
        if: always()
        run: |
          if [ -f /tmp/app.pid ]; then
            kill "$(cat /tmp/app.pid)" 2>/dev/null || true
          fi

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports-${{ github.run_id }}
          # REQUIRED, not cosmetic: `.lighthouseci` is a HIDDEN directory and
          # actions/upload-artifact@v7 defaults include-hidden-files to false,
          # so `.lighthouseci/*` matched nothing. Measured on run 33839332043 —
          # the artifact contained exactly one file, `tmp/app.log` (12,312 B).
          # Every Lighthouse report this repo has ever produced was discarded.
          include-hidden-files: true
          path: |
            .lighthouseci/*
            /tmp/app.log
          retention-days: 14
        continue-on-error: true
