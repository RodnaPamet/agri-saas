name: Lighthouse

# Mobile performance budget (390px). Builds + starts the app like the
# load-smoke job, then runs Lighthouse CI against the public /login page on a
# throttled mobile profile and asserts LCP / TBT / CLS budgets (see
# lighthouserc.json). INP is a field-only metric — tracked via web-vitals RUM
# (src/components/pwa/WebVitalsReporter.tsx), not here.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  lighthouse:
    name: "Lighthouse (mobile budget)"
    runs-on: ${{ vars.LARGE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20

    env:
      AUTH_TEST_MODE: "1"
      AUTH_TRUST_HOST: "1"
      AUTH_SECRET: "test-auth-secret-that-is-long-enough-32chars" # pragma: allowlist secret — test-only stub for the Lighthouse CI job
      JWT_SECRET: "test-auth-secret-that-is-long-enough-32chars" # pragma: allowlist secret — test-only stub for the Lighthouse CI job
      AUTH_URL: "http://localhost:3006"
      DATABASE_URL: postgresql://ci:ci_password@localhost:5432/ci_testdb?schema=public
      DATABASE_URL_TEST: postgresql://ci:ci_password@localhost:5432/ci_testdb?schema=public
      DIRECT_DATABASE_URL: postgresql://ci:ci_password@localhost:5432/ci_testdb?schema=public
      REDIS_URL: redis://localhost:6379
      RATE_LIMIT_ENABLED: "0"
      # P6.3 (#1812). At WORKFLOW level on purpose: the media seeding writes
      # the bytes and `next start` streams them, and the two have to agree
      # about where they are. They already did, by both falling back to
      # `/tmp/uploads` in `local-provider.ts` — agreement by coincident
      # defaults, which the next person to change that default would break
      # with nothing failing until a Lighthouse image 404'd.
      # Inside the WORKSPACE, not /tmp. A file in the shared OS temp directory
      # is readable and replaceable by any other user on the host, which
      # CodeQL flags as `js/insecure-temporary-file` (high) — correctly, even
      # though a runner is ephemeral. The provider's own default is
      # `/tmp/uploads`; this overrides it for the job rather than relying on it.
      FILE_STORAGE_ROOT: ${{ github.workspace }}/tmp/uploads
      STORAGE_PROVIDER: local
      DATA_ENCRYPTION_KEY: ci-test-data-encryption-key-32-chars-or-more-deterministic-x

    services:
      postgres:
        # Pin repeated from .github/postgis-image, the single source of
        # truth: `services.<id>.image` accepts no `env` context, so it
        # cannot read one. `tests/guards/postgis-image-single-source.test.ts`
        # fails CI if this literal and that file disagree (#860).
        image: postgres:16-trixie
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ci_testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci -d ci_testdb"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v7

      - name: Setup environment
        run: cp .env.e2e.example .env

      - name: Setup Node + Prisma client
        uses: ./.github/actions/setup-node-prisma
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Create PostgreSQL roles for RLS
        run: |
          PGPASSWORD=ci_password psql -h localhost -U ci -d ci_testdb <<'SQL'
          DO $$ BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'app_user') THEN CREATE ROLE app_user NOLOGIN; END IF;
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'postgres') THEN CREATE ROLE postgres NOLOGIN; END IF;
          END $$;
          GRANT app_user TO ci;
          GRANT app_user TO postgres;
          SQL

      - name: Enable pgvector (PGDG)
        uses: ./.github/actions/enable-pgvector
      - name: Apply Prisma migrations
        run: ./node_modules/.bin/prisma migrate deploy

      # One public farm profile, so /f/lighthouse renders a real page instead
      # of a 404 (P6.5, #1814). Without it the new budget would measure the
      # not-found page and report a flattering number for a route nobody can
      # reach.
      #
      # Inserted straight into `PublicFarmProfile` rather than through the
      # editor: that table is the PROJECTION — global, no `tenantId`, no RLS —
      # and the public reader queries only it, so a row here is the entire
      # precondition. Going through `FarmBrand` + publish would need a tenant,
      # a membership and an admin context to measure a page that reads none of
      # them.
      #
      # Cyrillic content on purpose. The page's LCP element is its heading, and
      # the Cyrillic glyphs are what the font actually has to deliver — Latin
      # placeholder text would measure a font subset this page never serves.
      # The flag that gates /f/{handle} (#1886). Without it the page 404s,
      # and Lighthouse ERRORS on a non-2xx main document rather than
      # measuring it — `Run #1...failed!` with exit code 1, which is how this
      # was found. `cohorts` is empty on purpose: a flag with cohorts is a
      # limited rollout, and this page is anonymous so there is no user to
      # match one against.
      - name: Enable the public-profile flag
        run: |
          PGPASSWORD=ci_password psql -h localhost -U ci -d ci_testdb <<'SQL'
          INSERT INTO "FeatureFlag" ("key", "enabled", "description", "cohorts", "updatedAt")
          VALUES ('social.public-profile', true, 'Lighthouse budget run', '{}', NOW()),
                 -- P6.3 (#1812). The media route 404s without this, so every
                 -- image on the page would be a 404 and the budget would
                 -- measure the text-only page it used to measure — green, and
                 -- reporting on a page the product no longer serves.
                 ('social.farm-media', true, 'Lighthouse budget run', '{}', NOW())
          ON CONFLICT ("key") DO UPDATE SET "enabled" = true;
          SQL

      - name: Seed one public farm profile
        run: |
          PGPASSWORD=ci_password psql -h localhost -U ci -d ci_testdb <<'SQL'
          INSERT INTO "PublicFarmProfile"
            ("handle", "displayName", "tagline", "about", "oblast", "crops", "displayNameLatin", "indexable", "projectedAt")
          VALUES
            ('lighthouse', 'Стопанство Победа', 'Зърно и слънчоглед от Добруджа',
             'Семейно стопанство в Добруджа, трето поколение. Отглеждаме пшеница, слънчоглед и рапица на 1200 декара.',
             'Добрич', ARRAY['пшеница', 'слънчоглед', 'рапица'], 'stopanstvo-pobeda', false, NOW())
          ON CONFLICT ("handle") DO NOTHING;
          SQL

      # The row has to be THERE, not merely inserted without error. An
      # `ON CONFLICT DO NOTHING` reports success for a row it skipped, and a
      # migration that renamed the table would fail the step above loudly —
      # but a silently empty table would leave the budget measuring a 404.
      - name: Verify the seeded profile is readable
        run: |
          COUNT=$(PGPASSWORD=ci_password psql -h localhost -U ci -d ci_testdb -tAc \
            "SELECT count(*) FROM \"PublicFarmProfile\" WHERE handle = 'lighthouse';")
          echo "seeded rows: $COUNT"
          if [ "$COUNT" != "1" ]; then
            echo "::error::/f/lighthouse has no projection row, so the Lighthouse budget would measure a 404."
            exit 1
          fi
          # BOTH preconditions, because either one missing produces the same
          # 404 and the same Lighthouse collection error.
          FLAG=$(PGPASSWORD=ci_password psql -h localhost -U ci -d ci_testdb -tAc \
            "SELECT enabled FROM \"FeatureFlag\" WHERE key = 'social.public-profile';")
          echo "flag enabled: $FLAG"
          if [ "$FLAG" != "t" ]; then
            echo "::error::social.public-profile is not enabled, so /f/lighthouse 404s and Lighthouse cannot measure it."
            exit 1
          fi

      # P6.3 (#1812) — give the page its images, so the LCP and CLS budgets
      # bound the page the product actually serves.
      #
      # Until #1812 /f/{handle} was text, and both budgets were measured on
      # text. A page that can now carry a logo and six photographs, measured
      # without any, produces a green gate that is indistinguishable from a
      # green gate over a fast page — the shape #2009 tracks.
      #
      # It seeds the CEILING (FARM_BRAND_MAX_PHOTOS), with synthetic images
      # sized like photographs rather than flat colour: a flat fixture is 11 KB
      # and would sail through any budget. The script's own docblock carries
      # the measurements.
      - name: Seed the public profile's images
        run: node scripts/seed-lighthouse-media.mjs

      # Same discipline as the profile check above: the rows have to BE there.
      # An image that 404s does not fail the page — the browser renders a
      # broken image and Lighthouse measures a page with no pictures, which is
      # precisely the false green this seeding exists to prevent.
      - name: Verify the images are published and servable
        run: |
          read -r LOGO PHOTOS <<<"$(PGPASSWORD=ci_password psql -h localhost -U ci -d ci_testdb -tAc \
            "SELECT coalesce(\"logoMediaHash\",'none'), coalesce(array_length(\"photoMediaHashes\",1),0)
               FROM \"PublicFarmProfile\" WHERE handle = 'lighthouse';" | tr '|' ' ')"
          echo "logo hash: ${LOGO:0:12}…  photos: ${PHOTOS}"
          if [ "$LOGO" = "none" ] || [ "${PHOTOS:-0}" -lt 1 ]; then
            echo "::error::/f/lighthouse has no published media, so the LCP and CLS budgets would measure a text-only page."
            exit 1
          fi
          # The FileRecord rows the media route resolves, and the bytes on disk
          # the provider streams. Either missing is a 404 per image.
          FILES=$(PGPASSWORD=ci_password psql -h localhost -U ci -d ci_testdb -tAc \
            "SELECT count(*) FROM \"FileRecord\"
              WHERE domain = 'farm-media' AND status = 'STORED' AND \"deletedAt\" IS NULL;")
          # The same root the seeding wrote to and the app will stream from —
          # `$FILE_STORAGE_ROOT`, not a repeated literal. A hardcoded path here
          # would have gone stale the moment that moved out of /tmp, and the
          # check would then have counted zero files and failed the job for the
          # wrong reason.
          ON_DISK=$(find "$FILE_STORAGE_ROOT" -type f -name '*.jpg' 2>/dev/null | wc -l)
          echo "FileRecord rows: $FILES   files on disk: $ON_DISK"
          if [ "$FILES" -lt 7 ] || [ "$ON_DISK" -lt 7 ]; then
            echo "::error::expected 7 farm-media files in the database and on disk; the media route resolves both."
            exit 1
          fi

      # `tmp/uploads`, matching FILE_STORAGE_ROOT above. It used to create
      # `tmp/test-uploads` — a directory nothing in this job read, because the
      # app fell through to `/tmp/uploads` instead. The seeding step made that
      # mismatch matter, so the name is now the one the app is told to use.
      - name: Create upload directory
        run: mkdir -m 700 -p "${{ github.workspace }}/tmp/uploads"

      - name: Build Next.js app
        run: npx next build --webpack
        env:
          # `next build` OOMs on the private-repo runners' ~2 GB default heap
          # (exit 134) — lift it as the CI workflow's build/jest jobs do.
          NODE_OPTIONS: --max-old-space-size=8192
          NODE_ENV: production

      - name: Start app (background)
        run: |
          nohup npx next start -p 3006 > /tmp/app.log 2>&1 &
          echo $! > /tmp/app.pid

      - name: Wait for /api/health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3006/api/health > /dev/null 2>&1; then
              echo "App is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::App failed to start within 60s. Last 100 lines of log:"
          tail -n 100 /tmp/app.log || true
          exit 1

      - name: "Gate: Lighthouse mobile budget"
        # Retried on COLLECTION failure only, never on a budget failure
        # (#1901). The distinction is the whole design: retrying a verdict
        # until it passes is gaming the gate, while retrying data COLLECTION
        # re-gathers measurements a crashed Chrome never produced.
        #
        # What this fixes, measured on #1900 — a PR touching only OpenAPI
        # descriptions:
        #
        #     Running Lighthouse 5 time(s) on .../login
        #     Run #1...done. #2...done. #3...done. #4...done.
        #     Run #5...failed!
        #     LH:largest-contentful-paint:warn Caught exception: NO_NAVSTART
        #
        # lhci aborts the whole run there, so `/f/lighthouse` was never
        # measured at all and the job reported a performance failure for a
        # page it never loaded. A re-run passed with 0 failed runs.
        #
        # The exposure is partly self-inflicted: #1880 took numberOfRuns from
        # 3 to 5 for precision (two 3-run medians of identical code came back
        # 296ms apart), which is 10 Chrome launches per job and raised the
        # chance of one aborting by about two thirds. The answer is tolerance,
        # not fewer samples.
        #
        # `.lighthouseci` is CLEARED before each attempt. The reporter reads
        # every `lhr-*.json` in that directory, so a failed attempt's partial
        # reports would otherwise be medianed together with the next
        # attempt's — the same pooling defect #1814 already produced once,
        # where one table mixed two pages.
        #
        # Each attempt is CAPPED, which `ci-retry-loop-timeout` requires and
        # for a reason worth restating: an unbounded attempt means attempt 1
        # consumes the whole job budget on a hang and attempts 2 and 3 never
        # exist — a retry loop that reads as protective with no path to
        # executing under the condition it was added for. My first version
        # used 600s and that guard caught it.
        #
        # 250s is DERIVED from measurement, not picked — but the
        # measurement was taken under `throttlingMethod: simulate`, which
        # records the trace at full speed. #1980 switched to `devtools`,
        # which throttles for real, so EVERY number below is from the old
        # method and the collection is expected to take longer per run.
        # `numberOfRuns` dropped 5 -> 3 to pay for that: a measured value
        # needs fewer samples than a modelled one (the observed LCP spread
        # was 65ms against the simulator's 2331ms).
        #
        # The cap is NOT raised to compensate, and cannot be:
        # ci-retry-loop-timeout.test.ts sets MAX_ATTEMPT_TIMEOUT_SECONDS to
        # 300, and this job's own arithmetic below allows ~296s. If 3 runs
        # under real throttling exceed 250s, the answer is fewer runs or one
        # URL per job, not a bigger cap.
        #
        #   lhci step, 10 runs, measured   137s / 143s / 165s   (simulate)
        #   whole job, measured            414s / 430s / 451s  (budget 1200s)
        #   so the rest of the job is      ~290s
        #
        # 250s leaves ~1.5x headroom over the slowest observed collection, and
        # the worst case fits the budget with room:
        #
        #   290 + 3 x 250 + 2 x 10 = 1060s  <=  1200s
        #
        # At 300s it would not: 290 + 900 + 20 = 1210s, over by ten seconds,
        # which is how a cap that satisfies the guard still kills the job.
        run: |
          log=/tmp/lhci.log
          started=$SECONDS
          for attempt in 1 2 3; do
            rm -rf .lighthouseci
            status=0
            timeout -k 10 250 npx --yes @lhci/cli@0.15.1 autorun \
              --config=lighthouserc.json > "$log" 2>&1 || status=$?
            cat "$log"
            if [ "$status" -eq 0 ]; then
              echo "::notice::Lighthouse passed in $((SECONDS - started))s (attempt ${attempt}/3)"
              exit 0
            fi
            # Reaching the assertion stage means every run collected and a
            # BUDGET was judged. That is a result about the page, so it is
            # final — re-rolling it would turn a regression gate into a
            # coin toss with three flips.
            if grep -q 'Checking assertions against' "$log"; then
              echo "::error::Lighthouse BUDGET failed (attempt ${attempt}/3, exit ${status}). Not retried — this is a verdict about the page, not a lost measurement."
              exit "$status"
            fi
            if [ "$status" -eq 124 ]; then
              # No bound in this message, deliberately. It said "after 600s"
              # while the cap two lines up said 250 — the message was left
              # behind when the cap was lowered, so a timeout misreported
              # its own limit. The cap cannot be interpolated here either:
              # ci-retry-loop-timeout.test.ts matches
              # /\btimeout\s+(?:-k\s+\d+\s+)?(\d+)\b/ and so REQUIRES a
              # literal, which is what let the two drift apart. Printing
              # the elapsed time instead is both drift-proof and more use
              # than restating a constant that is visible above.
              echo "::warning::Lighthouse COLLECTION timed out (attempt ${attempt}/3) after $((SECONDS - started))s elapsed — retrying"
            else
              echo "::warning::Lighthouse COLLECTION failed before assertions with exit ${status} (attempt ${attempt}/3) — retrying. A run that never navigated produced no data to keep."
            fi
            sleep 10
          done
          echo "::error::Lighthouse collection failed 3/3 after $((SECONDS - started))s"
          exit 1

      # The number behind the verdict (#796).
      #
      # `numberOfRuns: 3` writes three `lhr-<ts>.json` into `.lighthouseci`
      # and nothing ever read them, so the gate could say pass/fail and no one
      # could see the value it judged. That made any performance change
      # un-evidenceable — including the font preload #796 actually asks for.
      #
      # `if: always()` so a FAILED budget still prints its numbers: the run
      # where you most want the metric is the one that just broke.
      - name: Median metrics
        if: always()
        run: node scripts/ci/lighthouse-median.mjs .lighthouseci

      - name: Stop app
        if: always()
        run: |
          if [ -f /tmp/app.pid ]; then
            kill "$(cat /tmp/app.pid)" 2>/dev/null || true
          fi

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports-${{ github.run_id }}
          # REQUIRED, not cosmetic: `.lighthouseci` is a HIDDEN directory and
          # actions/upload-artifact@v7 defaults include-hidden-files to false,
          # so `.lighthouseci/*` matched nothing. Measured on run 33839332043 —
          # the artifact contained exactly one file, `tmp/app.log` (12,312 B).
          # Every Lighthouse report this repo has ever produced was discarded.
          include-hidden-files: true
          path: |
            .lighthouseci/*
            /tmp/app.log
          retention-days: 14
        continue-on-error: true
