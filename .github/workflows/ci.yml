# ───────────────────────────────────────────────────────────────
#  CI — Enterprise-grade pipeline
#  Jobs: changes · lint · typecheck · test · coverage · build · e2e
#        load-smoke · security · codeql · docker (+trivy)
#
#  Job graph:
#    changes (path filter) ─┐   (emits `code`; gates the heavy jobs)
#    lint ─────────────┐    │
#    typecheck ────────┤    │
#    test ─────────────┤    │
#    build ────────────┤    │
#      ├──→ e2e ───────┼────┤   e2e/load-smoke/docker also need `changes`
#      ├──→ load-smoke ┤    │
#      └──→ docker ────┤    │   (Trivy scan folded into docker)
#    security ─────────┤    │
#    codeql ───────────┘────┘
#
#  Triggers: PRs + pushes to main + weekly cron.
#
#  Cost controls:
#    • changes: content-only diffs (docs/**, messages/**, **/*.md) SKIP
#      e2e/load-smoke/docker — a skipped required check passes protection.
#    • cancel-in-progress: PRs only (push/schedule runs always finish).
#    • coverage: main-push only. load-smoke: main-push only.
#    • schedule (weekly): scan-refresh only — build + docker/Trivy + codeql;
#      test/e2e/load-smoke/coverage are skipped.
# ───────────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Merge queue. GitHub builds a temporary ref of `main` + every PR already
  # queued + this one, and merges only if the required checks pass against
  # THAT combination. This is the only stage that tests the combination —
  # a `pull_request` run tests the PR against main as it was when the run
  # started, so two PRs that each pass can still break main together. That
  # happened on 2026-07-29: #454's tests were written against the exchange
  # API that #456 reshaped in parallel; both merged clean (no textual
  # conflict) and main went red on Typecheck + Test shard 4/4, needing #459
  # to fix. See `docs/implementation-notes/2026-07-31-merge-queue.md`.
  #
  # The queue runs the LEAN set deliberately: Lint, Typecheck, Test, Build,
  # Security, CodeQL. E2E and Docker skip here (see their `if:`) because a
  # skipped required check satisfies branch protection, and because they are
  # the two jobs least likely to catch a MERGE collision — that class shows
  # up as a type or unit failure, which Typecheck catches in ~3 minutes.
  # Both still run twice per change: on the PR, and on main after landing.
  merge_group:
  # Weekly scheduled scan — GitHub's Code Scanning UI expects a
  # periodic refresh of CodeQL + Trivy results on the default branch,
  # independent of PR cadence. Without this the Security tab can
  # complain about stale analyses. Sunday at 06:00 UTC is during
  # off-hours for the team but during weekday-morning for any
  # security-team triage.
  schedule:
    - cron: "0 6 * * 0"

concurrency:
  # PRs share one group per ref so a force-push rebase kills the in-flight run
  # instead of stacking a second full one.
  #
  # Push (to main) and schedule runs get a group PER COMMIT, so they never
  # queue behind each other and can never be discarded. `cancel-in-progress:
  # false` alone does NOT achieve that: it protects only the run that is
  # already EXECUTING. A run still PENDING in the group is cancelled the
  # moment a newer one arrives, because GitHub keeps just the newest pending
  # run per group.
  #
  # That is not theoretical. On 2026-07-28 three consecutive main merges
  # (#440, #437, #441) landed inside ~30 minutes; the CI runs for the first
  # two were cancelled with ZERO jobs executed, so neither commit got a SARIF
  # upload or a coverage-gate verdict. The gate had in fact been failing since
  # #435, and because it is `if: github.event_name == 'push'` and path-filtered
  # to skip on PRs that do not touch `src/`, a red main went unnoticed across
  # four merges. Per-commit groups are what the old comment claimed the old
  # config bought, and did not.
  #
  # Cost: rapid merges now run main CI concurrently rather than collapsing to
  # the tip. That is the point — the coverage gate and SARIF upload are
  # per-commit signals, and a signal that silently skips is worse than a slow
  # one.
  group: ci-${{ github.ref }}${{ github.event_name != 'pull_request' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write   # dependency-review comments
  security-events: write # CodeQL SARIF upload
  actions: read          # CodeQL analysis

# ── CI runner sizing ──
# Heavy jobs read `runs-on: ${{ vars.LARGE_RUNNER || 'ubuntu-latest' }}`.
# On Team / Enterprise plans, set the `LARGE_RUNNER` repository
# variable (Settings → Variables → Actions) to a configured
# GitHub-hosted larger-runner label (e.g. `ubuntu-4core`,
# `ubuntu-8core`). Unset → workflow falls back to the free 2-vCPU
# `ubuntu-latest`, so this file works on every plan.

env:
  NODE_VERSION: "22"
  SKIP_ENV_VALIDATION: "1"
  # ── Dummy secrets (CI-only — no real credentials) ──
  AUTH_SECRET: ci-auth-secret-that-is-long-enough
  JWT_SECRET: ci-jwt-secret-that-is-long-enough
  NEXTAUTH_SECRET: ci-auth-secret-that-is-long-enough
  NEXTAUTH_URL: http://localhost:3006
  AUTH_URL: http://localhost:3006
  GOOGLE_CLIENT_ID: ci-google-id
  GOOGLE_CLIENT_SECRET: ci-google-secret
  MICROSOFT_CLIENT_ID: ci-ms-id
  MICROSOFT_CLIENT_SECRET: ci-ms-secret
  MICROSOFT_TENANT_ID: ci-ms-tenant
  UPLOAD_DIR: /tmp/ci-uploads
  CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3006
  FILE_STORAGE_ROOT: /tmp/ci-uploads

jobs:
  # ═══════════════════════════════════════════════════════════════
  #  Job 0: Detect changes — path filter
  #  Emits `code=true` when a change touches anything OTHER than docs,
  #  i18n message catalogs, or markdown. The heavy build-dependent jobs
  #  (e2e, docker/Trivy, load-smoke) gate on it so a content-only PR
  #  (docs/**, messages/**, **/*.md) skips them — a skipped required
  #  check counts as passing under branch protection. lint/typecheck/
  #  test/security still run, so i18n parity + rendered-string tests
  #  keep gating content-only changes.
  # ═══════════════════════════════════════════════════════════════
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # `|| 'true'` is the merge-queue path: the filter step below does not run
      # there, so the output is empty and defaults to "code changed". That is
      # the conservative direction (it can only cause MORE to run, never less),
      # and in practice nothing reads it in the queue — all three consumers
      # (e2e-shard, load-smoke, docker) are excluded from `merge_group`.
      code: ${{ steps.filter.outputs.code || 'true' }}
    steps:
      - uses: actions/checkout@v7
      # Skipped on `merge_group`: a merge-queue event carries no base/head pair
      # for paths-filter to diff, and this job is a REQUIRED check — letting the
      # action guess a base risks blocking every queued merge on an error that
      # has nothing to do with the change.
      - uses: dorny/paths-filter@v4
        if: github.event_name != 'merge_group'
        id: filter
        with:
          # gitignore-style: match everything, then subtract the content-only
          # paths. `code` is true iff at least one NON-content file changed.
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!messages/**'
              - '!**/*.md'

  # ═══════════════════════════════════════════════════════════════
  #  Job 1: Lint — ESLint + Next.js lint rules
  #  Fast, no DB needed. Fails immediately on lint errors.
  # ═══════════════════════════════════════════════════════════════
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node + Prisma client
        uses: ./.github/actions/setup-node-prisma
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run ESLint
        run: npm run lint

      - name: i18n parity + untranslated check
        # Fails on MISSING / ORPHAN / PLACEHOLDER-DRIFT / UNTRANSLATED-COPY
        # between en.json and every locale. Rides the required "Lint" check;
        # the no-new-hardcoded-string ratchet runs in the Jest test job.
        run: node scripts/i18n-diff.mjs --check

  # ═══════════════════════════════════════════════════════════════
  #  Job 2: Typecheck — TypeScript strict compilation
  #  Fast, no DB needed. Catches type errors early.
  # ═══════════════════════════════════════════════════════════════
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node + Prisma client
        uses: ./.github/actions/setup-node-prisma
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run tsc --noEmit
        # tsc's peak heap grows with the codebase + the generated Prisma
        # client; the runner's default ~2 GB ceiling started OOMing. Invoke
        # tsc through node with the heap flag applied DIRECTLY to that V8
        # instance (NODE_OPTIONS does not reliably reach the tsc process).
        run: node --max-old-space-size=8192 ./node_modules/typescript/bin/tsc --noEmit

  # ═══════════════════════════════════════════════════════════════
  #  Job 2b: AI evals — NON-BLOCKING quality report (feat/ai-evals-safety)
  #
  #  Runs the offline eval harness (`npm run eval:ai`): deterministic
  #  MCQ/contains scoring + the safety-behaviour cases (real advisor with
  #  stubbed RAG/routing/product-safety). NO AI secrets required — the
  #  LLM-judge stays skipped unless AI_EVAL_LLM_JUDGE=1 + a backend is
  #  configured. `continue-on-error: true` keeps it advisory: it reports
  #  (artifact + job summary) and never fails the build.
  # ═══════════════════════════════════════════════════════════════
  ai-evals:
    name: AI evals (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node + Prisma client
        uses: ./.github/actions/setup-node-prisma
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run AI eval harness (offline, no secrets)
        env:
          SKIP_ENV_VALIDATION: "1"
        run: npm run eval:ai

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-eval-report
          path: scripts/ai/eval/report.json
          if-no-files-found: warn
        continue-on-error: true

  # ═══════════════════════════════════════════════════════════════
  #  Job 3: Test — Jest unit + integration + architectural guards
  #  Needs Postgres for integration tests.
  #
  #  Sharded across N matrix jobs via `jest --shard=K/N`. The default
  #  TOTAL_SHARDS = 4 turns a ~30-min single-process run into ~4×8-min
  #  parallel runs (each shard owns ~1/N of the suite). Each shard
  #  still runs serially inside its own process (`--runInBand`) to
  #  preserve the test-suite's "one DB per worker" invariant.
  #
  #  When `vars.LARGE_RUNNER` is set on Team / Enterprise plans, the
  #  shards land on the larger runner — combined with sharding,
  #  end-to-end Test time drops from ~30 min → ~3-5 min per PR.
  #
  #  Branch protection: the required check is the "Test" SUMMARY
  #  job below (see `test-summary`), not the matrix members. That
  #  way a future shard-count change doesn't require updating the
  #  required-check set.
  # ═══════════════════════════════════════════════════════════════
  test:
    name: "Test (shard ${{ matrix.shard }}/${{ matrix.total }})"
    runs-on: ${{ vars.LARGE_RUNNER || 'ubuntu-latest' }}
    # Skip on the weekly scheduled run — that cron exists to refresh the
    # CodeQL + Trivy scans, not to re-run the whole suite (build + docker +
    # codeql still run on schedule; test/e2e/load-smoke/coverage do not).
    if: ${{ github.event_name != 'schedule' }}
    # 35-minute budget. Pre-shard, the unit + integration + guards
    # + contracts suite ran ~24-25m and bumped this to 35m for
    # variance headroom. Each shard now does ~1/N of the work, but
    # we keep the 35m cap as a safety net — the cluster of shards
    # finishes well under that.
    timeout-minutes: 35

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
        total: [6]

    env:
      DATABASE_URL: postgresql://ci:ci_password@localhost:5432/ci_testdb?schema=public
      DATABASE_URL_TEST: postgresql://ci:ci_password@localhost:5432/ci_testdb?schema=public
      DIRECT_DATABASE_URL: postgresql://ci:ci_password@localhost:5432/ci_testdb?schema=public
      # Redis for tests/integration/bullmq-real-api.test.ts — the only place
      # BullMQ itself is executed rather than mocked. REQUIRE is on because
      # this job DECLARES a redis service: a skip here would mean the service
      # is broken, and a silent skip is precisely the failure mode that test
      # exists to close.
      #
      # Deliberately REDIS_URL_TEST, not REDIS_URL. `getRedisClient()` in
      # src/lib/redis.ts returns null when REDIS_URL is unset, and the whole
      # suite relies on that graceful-degradation path. Setting REDIS_URL
      # job-wide flipped every Redis-aware code path to real connections and
      # blew shard runtime from ~500s to the 35-minute job timeout. This var
      # is read by that one test file and nothing else.
      REDIS_URL_TEST: redis://localhost:6379
      BULLMQ_SMOKE_REQUIRE_REDIS: "1"
      # Same argument, applied to the database this job also declares.
      # tests/guardrails/rls-coverage.test.ts skips its DB-backed
      # assertions when Postgres is unreachable — deliberately, so a
      # developer without a local Postgres can still run the sweep —
      # and prints a banner instead. That means the ENTIRE RLS +
      # tenant-isolation assurance layer can go quiet and still report
      # green, which CLAUDE.md records happening live: six assertions
      # failed against a stale DB and then went SILENT when that DB
      # became unreachable. This job creates the RLS roles and runs
      # `prisma migrate deploy`, so a skip here means the service is
      # broken and the build should say so.
      RLS_GUARDRAIL_REQUIRE_DB: "1"
      # GAP-03 — deterministic test key so the startup-encryption-check
      # integration test can simulate NODE_ENV=production with a real
      # key, AND so any future test that asserts prod-only encryption
      # paths works without per-test env mutation. The unit suite still
      # uses the dev fallback under NODE_ENV=test (jest.setup.js sets
      # SKIP_ENV_VALIDATION=1).
      DATA_ENCRYPTION_KEY: ci-test-data-encryption-key-32-chars-or-more-deterministic-x

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ci_testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci -d ci_testdb"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node + Prisma client
        uses: ./.github/actions/setup-node-prisma
        with:
          node-version: ${{ env.NODE_VERSION }}

      # ── Quality gate: migrations must exist ──
      - name: "Gate: Prisma migrations exist"
        run: |
          COUNT=$(find prisma/migrations -name "migration.sql" 2>/dev/null | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No Prisma migrations found in prisma/migrations/"
            exit 1
          fi
          echo "✓ Found $COUNT migration(s)"

      # ── Create roles required by RLS migrations ──
      - name: Create PostgreSQL roles for RLS
        run: |
          PGPASSWORD=ci_password psql -h localhost -U ci -d ci_testdb <<'SQL'
          DO $$ BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'app_user') THEN CREATE ROLE app_user NOLOGIN; END IF;
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'postgres') THEN CREATE ROLE postgres NOLOGIN; END IF;
          END $$;
          GRANT app_user TO ci;
          GRANT app_user TO postgres;
          SQL

      # ── Apply schema to test DB ──
      - name: Enable pgvector (PGDG)
        uses: ./.github/actions/enable-pgvector
      - name: Apply Prisma migrations
        run: ./node_modules/.bin/prisma migrate deploy

      # ── Jest: unit + integration tests (sharded) ──
      # Each matrix worker runs Jest's deterministic 1-of-N hash split.
      # `--shard=${{ matrix.shard }}/${{ matrix.total }}` keeps each
      # test file on exactly one shard, so per-DB-row test fixtures
      # never collide across shards. The intra-shard run stays
      # `--runInBand` for the "one DB per worker" invariant.
      - name: "Run tests: unit + integration (shard)"
        # Invoke jest via `node --max-old-space-size=8192` (mirrors the
        # Typecheck job's tsc call). The runner's default ~2 GB V8 heap is
        # too small for the `--runInBand` suite and OOMs ("Reached heap
        # limit … Aborted"); NODE_OPTIONS does not reliably reach the jest
        # process, so the flag is applied to this V8 instance directly.
        run: |
          status=0
          timeout --signal=INT --kill-after=60s 25m \
            node --max-old-space-size=8192 ./node_modules/jest/bin/jest.js \
              --runInBand --coverage \
              --shard=${{ matrix.shard }}/${{ matrix.total }} \
              --coverageReporters=json \
              --coverageDirectory "coverage-shard-${{ matrix.shard }}" || status=$?

          if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
            echo "::error::Test shard ${{ matrix.shard }} exceeded its 25-minute budget."
            echo "::error::A shell timeout is used so the step FAILS with its log intact — a"
            echo "::error::runner cancellation drops the un-flushed buffer and leaves no diagnosis."
            exit 1
          fi
          exit "$status"

      # The gate scores the MERGED map, so every shard hands its report over
      # even when its own tests failed. A shard that dies without uploading
      # becomes a `--expect` refusal downstream — the correct outcome, but a
      # confusing one to debug from a missing artifact.
      - name: Upload shard coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: coverage-shard-${{ matrix.shard }}/coverage-final.json
          retention-days: 14
          if-no-files-found: error

      # ── Architectural guard + API contract gates ──
      # These suites are fast (~30s combined) and not sharded — they
      # are an EXPLICIT pass/fail signal in the CI log distinct from
      # the wider Jest run. Pinned to shard 1 so they execute exactly
      # once per CI run (no redundant work across shards).
      #
      # On legitimate contract changes:
      #   1. `npm run openapi:generate`         (rewrites public/openapi.json)
      #   2. `npx jest tests/contracts/ -u`     (updates per-schema snapshots)
      #   3. Commit both files together. Reviewer sees the diff
      #      against the previous contract and approves explicitly.
      - name: "Run tests: architectural guards"
        if: matrix.shard == 1
        run: node --max-old-space-size=8192 ./node_modules/jest/bin/jest.js tests/guards/ --runInBand --forceExit --no-coverage

      - name: "Gate: API contract tests"
        if: matrix.shard == 1
        run: node --max-old-space-size=8192 ./node_modules/jest/bin/jest.js tests/contracts/ --runInBand --forceExit --no-coverage --ci

  # ═══════════════════════════════════════════════════════════════
  #  Job 3b: Test (summary) — single required check for the matrix
  #
  #  GitHub branch-protection rules can target a stable check name;
  #  this job aggregates the matrix shards into one. A future
  #  shard-count change here keeps the required check name the same.
  # ═══════════════════════════════════════════════════════════════
  test-summary:
    name: Test
    needs: [test]
    runs-on: ubuntu-latest
    # Skip alongside the test matrix on schedule (else the shard-result check
    # below would read `skipped` and fail). Otherwise always run so a failed
    # shard is surfaced even when another job cancels.
    if: ${{ !cancelled() && github.event_name != 'schedule' }}
    steps:
      - name: Verify every shard succeeded
        # `needs.test.result` is the aggregated status across all
        # matrix variants — `success` only when every shard passed.
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "::error::One or more Test shards failed (result=${{ needs.test.result }})"
            exit 1
          fi
          echo "All Test shards passed."

  # ═══════════════════════════════════════════════════════════════
  #  Job 4: Coverage gate — scores the floors on the MERGED shard map.
  #  Blocking: fails if a threshold group drops below its floor.
  #
  #  RUNS ON PULL REQUESTS TOO, and that is the point.
  #
  #  This comment used to read "RUNS ON MAIN PUSH ONLY", with the rationale that
  #  instrumenting a second full suite added ~30 min of CPU per PR for a
  #  duplicate signal. The premise was right and the conclusion had a hole: a
  #  main-push-only gate can only detect a regression AFTER the merge, and
  #  making it a required check in that shape is THEATRE — a job skipped by
  #  `if:` reports SKIPPED, and a skipped required check counts as PASSING.
  #
  #  The duplicate-suite objection is gone because there is no second suite:
  #  `test` collects coverage itself. Instrumentation costs ~1.5x and the 6-way
  #  split is ~1.5x finer, so shards stay 5-9 min and PR wall clock stays under
  #  E2E's ~16 min. Main pushes got CHEAPER — the standalone 6-shard coverage
  #  job is gone.
  #
  #  NOTE for anyone re-flooring: the `Coverage summary` table this job
  #  prints is NOT what the "global" threshold checks. jest subtracts the
  #  path-specific threshold keys in jest.thresholds.json from the global
  #  group, so summary-branches (69.78) and enforced-global-branches
  #  (65.46) differ by ~4 points. Take the number from the
  #  `does not meet "global" threshold` line. Reading the summary instead
  #  broke main on 2026-08-20.
  #
  #  The ~30 min estimate is accurate — measured 33m42s on run
  #  32313528177 (1601 suites / 24,231 tests), against a longest
  #  PR job of ~15 min. Moving this to PRs would MORE THAN DOUBLE
  #  the critical path, so the main-push-only decision stands.
  #
  #  BUT one clause of the original rationale is now known to be
  #  false, and it is left here rather than quietly deleted: "if a
  #  PR causes a regression, the FIRST main push will block."
  #  Mechanically true, practically not — a red main push gates
  #  nothing downstream. Issue #398 documented the gate red across
  #  FIVE consecutive main pushes (#386, #387, #384, #391, #392)
  #  with nobody acting, `Load Test (k6)` stayed broken eight days
  #  the same way, and the concurrency comment above records a red
  #  main going unnoticed across four merges.
  #
  #  So the real exposure is not "which event triggers this" but
  #  "nobody is told when main goes red" — a notification problem,
  #  not a trigger problem, and not one a `if:` line can fix. The
  #  durable fix for the cost side is the SHARDING noted below;
  #  once this job is as fast as `test`, running it per-PR becomes
  #  affordable and the question is worth reopening.
  # ═══════════════════════════════════════════════════════════════
  coverage-gate:
    name: "Coverage (≥60%)"
    runs-on: ubuntu-latest
    needs: [test]
    # `always()` so a dead shard reaches the merge, which then REFUSES on the
    # count rather than quietly reporting a number over less code.
    #
    # Runs on PULL REQUESTS too, which is the whole point of folding coverage
    # into `test`. While it was main-push only the gate could only ever detect a
    # regression AFTER the merge — and adding it to branch protection in that
    # shape would have been theatre, because a job skipped by `if:` reports as
    # SKIPPED and a skipped required check counts as PASSING.
    if: ${{ always() && github.event_name != 'schedule' }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node + Prisma client
        uses: ./.github/actions/setup-node-prisma
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download shard reports
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-shard-*
          path: coverage-shards

      - name: Merge shard reports
        # --expect is the load-bearing flag. A missing shard does not fail a
        # merge on its own; it shrinks the denominator and usually RAISES the
        # percentages, so the gate would pass while measuring less code than it
        # believes. A green gate over the wrong population is worse than the
        # dark gate this replaces, because nobody investigates green.
        run: node scripts/merge-coverage.mjs --expect 6 --out coverage coverage-shards

      - name: "Gate: test coverage thresholds"
        # ENFORCING. This ran --report-only from the day the job was sharded
        # until 2026-08-23, because a merged map is not a live jest run and the
        # equivalence had never been demonstrated at full scale. It has been
        # now — run 32662217666 on 71e00520:
        #
        #     file set   1381 = 1381, identical
        #     per-file   all 1381 shared files identical
        #     all five threshold groups identical to the decimal
        #
        # `--report-only` remains a supported flag for debugging a failing gate
        # without blocking a push; it is simply no longer passed. Re-run the
        # proof with the `Coverage parity (reference run)` workflow whenever the
        # merge MECHANISM changes — a jest or istanbul major, an edit to
        # merge-coverage.mjs, a change to the shard count.
        #
        # The checker prints ALL FIVE group rows unconditionally. Jest prints
        # them only on failure, which is why the enforced number had to be
        # reverse-engineered from coverage-summary.json — and why re-flooring
        # from the whole-map summary table broke main on 2026-08-20. The
        # populations differ by ~4.45 points on branches.
        run: |
          node scripts/check-coverage-thresholds.mjs \
            --coverage coverage/coverage-final.json \
            --thresholds jest.thresholds.json

      - name: Upload merged coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
        continue-on-error: true

  build:
    name: Build
    runs-on: ${{ vars.LARGE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node + Prisma client
        uses: ./.github/actions/setup-node-prisma
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Env validation is INTENTIONALLY skipped at build time.
      # `SKIP_ENV_VALIDATION: "1"` (workflow-level `env:` above)
      # makes `src/env.ts` skip its zod check — CI has only dummy
      # secrets, so a real validation would fail. This is deliberate,
      # not an oversight.
      #
      # The REAL env gate is RUNTIME, not build time:
      #   - `src/env.ts` validates on process start (when
      #     SKIP_ENV_VALIDATION is unset — i.e. in prod);
      #   - `src/instrumentation.ts` runs the GAP-03 fail-fast
      #     startup checks (encryption key, Redis auth, …).
      # A green Build job is therefore NOT an env-config pass —
      # runtime is. See docs/ci-cd-pipeline-integrity.md § Build /
      # env-validation discipline. The posture is locked by
      # tests/guards/ci-pipeline-integrity.test.ts.
      # Incremental-build cache: restore Next's webpack module cache so
      # `next build` reuses unchanged compilation across runs. SAFE —
      # the build still runs and produces correct output; only the
      # intermediate cache is reused. Per-commit key + lockfile
      # restore-key = the Next.js-recommended CI pattern.
      - name: Cache Next.js build cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextcache-build-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nextcache-build-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build Next.js (production)
        # --webpack: nonce strict-CSP chunks (see Dockerfile + impl note).
        run: npx next build --webpack
        env:
          # `next build` sits near the runner's default ~2 GB V8 heap ceiling
          # and OOMs on the private-repo runners; lift it as the jest/tsc jobs do.
          NODE_OPTIONS: --max-old-space-size=8192
          NODE_ENV: production

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-failure-logs
          path: .next/trace
          retention-days: 7
        continue-on-error: true

  # ═══════════════════════════════════════════════════════════════
  #  Job 6: E2E — Playwright browser tests
  #  Needs: build (validates app compiles before expensive E2E)
  # ═══════════════════════════════════════════════════════════════
  e2e-shard:
    name: E2E (shard ${{ matrix.shard }}/2)
    needs: [build, changes]
    # Skip on content-only changes (docs/messages/md), on the weekly scan, and
    # in the merge queue. A skipped job leaves the aggregating `e2e` gate to
    # pass (see below), which is what keeps the queue lean without dropping
    # E2E as a required check — it still runs on the PR and again on main.
    if: ${{ github.event_name != 'schedule' && github.event_name != 'merge_group' && needs.changes.outputs.code == 'true' }}
    runs-on: ${{ vars.LARGE_RUNNER || 'ubuntu-latest' }}
    # ── E2E parallelism: cross-JOB sharding, NOT intra-job workers ──
    #
    # History (see #113/#118): two earlier attempts were reverted.
    #   • `workers: 3` intra-job — flaked timing-sensitive specs (tenant
    #     creation, audit-pack share, offline queue, a11y) under parallel
    #     load on ONE runner (CPU/mem contention), different specs each run.
    #   • an early shard matrix — duplicated setup AND coupled shards
    #     (they shared state).
    #
    # This approach avoids BOTH failure modes:
    #   • Each shard still runs SERIALLY (playwright.config workers: 1) — no
    #     intra-runner contention, so the timing-sensitive specs behave
    #     exactly as they do today, just split across two runners.
    #   • Each shard is fully self-contained: its OWN postgres/redis service
    #     container + its own migrate+seed (service containers are per-job),
    #     so there is zero cross-shard coupling — no shared DB/state.
    # `--shard=i/2` (below) splits the test FILES; `fail-fast: false` lets
    # both shards report. The cost is duplicated setup (build+seed) per
    # shard — the deliberate trade of runner-minutes for wall-clock. Each
    # shard now runs well under 40min (was ~46-50 serial). To rebalance,
    # bump the matrix + the `/N` in the run steps together (kept in sync
    # via the matrix length).
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    timeout-minutes: 40

    env:
      AUTH_TEST_MODE: "1"
      AUTH_TRUST_HOST: "1"
      AUTH_SECRET: "test-auth-secret-that-is-long-enough-32chars" # pragma: allowlist secret — test-only stub for the e2e CI job
      JWT_SECRET: "test-auth-secret-that-is-long-enough-32chars" # pragma: allowlist secret — test-only stub for the e2e CI job
      AUTH_URL: "http://localhost:3006"
      DATABASE_URL: postgresql://ci:ci_password@localhost:5432/ci_testdb?schema=public
      DATABASE_URL_TEST: postgresql://ci:ci_password@localhost:5432/ci_testdb?schema=public
      DIRECT_DATABASE_URL: postgresql://ci:ci_password@localhost:5432/ci_testdb?schema=public
      # GAP-13: `next start` refuses to boot in prod without REDIS_URL.
      # The previous `RATE_LIMIT_ENABLED=0` escape hatch was removed
      # (Redis underpins login throttle, invite redemption, BullMQ jobs,
      # session coordination — not just rate limits) — see the docblock
      # in src/instrumentation.ts. The redis service below satisfies
      # the boot check; RATE_LIMIT_ENABLED stays "0" so 429s don't
      # interfere with the auth + UI flow under test.
      REDIS_URL: redis://localhost:6379
      RATE_LIMIT_ENABLED: "0"
      # GAP-03 startup sentinel — the encryption-key check refuses to boot
      # in prod mode without a >=32-char DATA_ENCRYPTION_KEY. Same synthetic
      # CI-only value other jobs in this workflow use (lines 128, 209) so
      # ciphertexts written by one job decrypt under another.
      DATA_ENCRYPTION_KEY: ci-test-data-encryption-key-32-chars-or-more-deterministic-x

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ci_testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci -d ci_testdb"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v7

      - name: Setup environment
        run: cp .env.e2e.example .env

      - name: Setup Node + Prisma client
        uses: ./.github/actions/setup-node-prisma
        with:
          node-version: ${{ env.NODE_VERSION }}

      # ── Create roles required by RLS migrations ──
      - name: Create PostgreSQL roles for RLS
        run: |
          PGPASSWORD=ci_password psql -h localhost -U ci -d ci_testdb <<'SQL'
          DO $$ BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'app_user') THEN CREATE ROLE app_user NOLOGIN; END IF;
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'postgres') THEN CREATE ROLE postgres NOLOGIN; END IF;
          END $$;
          GRANT app_user TO ci;
          GRANT app_user TO postgres;
          SQL

      - name: Enable pgvector (PGDG)
        uses: ./.github/actions/enable-pgvector
      - name: Apply Prisma migrations
        run: ./node_modules/.bin/prisma migrate deploy

      - name: Seed test database
        run: npx tsx prisma/seed.ts

      - name: Create upload directory
        run: mkdir -p /tmp/ci-uploads

      # Incremental-build cache (E2E test-mode build → `.next-test/`,
      # see next.config.js distDir). SAFE: build still runs; only the
      # webpack module cache is reused. Separate key from the plain
      # build job because NEXT_PUBLIC_TEST_MODE is inlined here.
      - name: Cache Next.js build cache (test-mode)
        uses: actions/cache@v6
        with:
          path: .next-test/cache
          key: nextcache-e2e-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nextcache-e2e-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      # Belt-and-braces tripwire (#764). Blackholes the basemap CDN for the
      # WHOLE job — browser AND the Next server process — so a run that still
      # reaches it fails fast instead of silently depending on a third party.
      # Nothing listens on 127.0.0.1:443, so it is ECONNREFUSED, never a hang.
      # This is NOT the detector: tests/e2e/map-basemap-hermetic.spec.ts
      # observes the request and names the URL. Do NOT append `|| true` — a
      # step that cannot fail is a skipped step wearing a green tick.
      - name: Blackhole the basemap CDN
        run: echo "127.0.0.1 demotiles.maplibre.org" | sudo tee -a /etc/hosts

      - name: Build Next.js app
        # --webpack: match the deployed bundler (nonce strict-CSP chunks).
        run: npx next build --webpack
        env:
          # `next build` sits near the runner's default ~2 GB V8 heap ceiling
          # and OOMs on the private-repo runners; lift it as the jest/tsc jobs do.
          NODE_OPTIONS: --max-old-space-size=8192
          NODE_ENV: production
          NEXT_TEST_MODE: "1"
          # NEXT_PUBLIC_* env vars are inlined at BUILD time, so they
          # must be set on the build step (not just on `playwright test`)
          # to take effect in the runtime bundle. Mirrors what
          # `scripts/e2e-local.mjs` does. Suppresses the Driver.js
          # onboarding tour AND the sidebar calendar-badge polling —
          # both produce background network noise that keeps
          # `waitForLoadState('networkidle')` from settling within the
          # 180s test timeout on slow CI runners.
          NEXT_PUBLIC_TEST_MODE: "1"
          # Hermetic basemap (#764): MapCanvas renders an inline, network-free
          # fixture style instead of demotiles, so a run never depends on a
          # third-party CDN being up. NEXT_PUBLIC_* is inlined at BUILD time
          # (see above), so this MUST live here and not on `playwright test`.
          # Mirrored in scripts/e2e-local.mjs. The SERVER half is
          # E2E_BASEMAP_FIXTURE_TILES, set on webServer.command in
          # playwright.config.ts — a runtime var needs no build-time inlining.
          NEXT_PUBLIC_MAP_BASEMAP_FIXTURE: "1"

      # ── Playwright with browser cache ──
      - name: Get Playwright version
        id: pw-version
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

      # ── Playwright install: BOTH steps are capped ──
      #
      # These shell out to apt-get, and apt occasionally stalls on a runner.
      # Without a step-level cap the stall consumes the job's whole 40-minute
      # budget and the E2E tests never start — and because GitHub reports a
      # timed-out job as `cancelled`, it reads like a concurrency cancellation
      # rather than a hang, which is exactly how it was misdiagnosed the first
      # time.
      #
      # Measured 2026-08-19 across eight consecutive runs: 11s, 12s, 14s, 44s,
      # 62s — then 20m (run 32208305084, which passed only because 20 < 40) and
      # 35m43s (run 32229209296, BOTH shards, on BOTH attempts). A cap turns
      # that into a fast, clearly-labelled failure a re-run can clear in
      # minutes instead of eighty.
      #
      # 8 minutes is ~8x the slowest healthy observation, so it cannot fire on
      # a merely slow runner. Deliberately NOT `|| true`: skipping system deps
      # would leave a broken browser and surface as confusing spec failures
      # several steps later, which is worse than an honest red step.
      # ── Playwright install: what these steps ACTUALLY do ──
      #
      # Established from a real job log on 2026-08-19 (run 32288101523),
      # after two earlier fixes (#608 cap, #613 retry) that were both built
      # on the unexamined assumption that this step installs things chromium
      # needs to run. It does not.
      #
      # On the cache-hit path, `install-deps` reports 26 packages "already
      # the newest version" — every chromium RUNTIME library (libnss3,
      # libgbm1, libatk*, libcups, libdrm, …) ships in the ubuntu-24.04
      # runner image. The 9 it actually installs are ALL FONTS:
      #   fonts-freefont-ttf fonts-ipafont-gothic fonts-tlwg-loma-otf
      #   fonts-unifont fonts-wqy-zenhei xfonts-cyrillic xfonts-encodings
      #   xfonts-scalable xfonts-utils
      #
      # So chromium launches fine without this step. What degrades is glyph
      # rendering for CJK/Thai/Cyrillic in SCREENSHOTS — and screenshots are
      # `only-on-failure` debugging artifacts, while every assertion reads
      # the DOM, which is font-independent. That is a real but small loss,
      # and it is not worth failing a job for.
      #
      # WHY THE RETRY IS GONE. `timeout` kills the `npx` wrapper; the
      # `sudo apt-get` child SURVIVES holding /var/lib/dpkg/lock-frontend.
      # Every later attempt then dies in milliseconds on
      #   E: Could not get lock … held by process NNNN (apt-get)
      # so the retry could never succeed — observed doing exactly that
      # three times in one job. A retry that cannot work is worse than none:
      # it looks like resilience.
      #
      # The uncached path is DIFFERENT and stays fatal: it downloads the
      # BROWSER, which genuinely is load-bearing. It keeps a retry, with the
      # lock recovery the cached path taught us is required.
      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 20
        run: |
          for attempt in 1 2 3; do
            echo "::group::playwright install --with-deps (attempt $attempt/3)"
            if timeout 300 npx playwright install --with-deps chromium; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "::warning::playwright install attempt $attempt/3 failed; clearing apt locks"
            # timeout killed the wrapper, not the apt-get child. Without
            # this the next attempt fails instantly on the dpkg lock.
            sudo pkill -9 -f apt-get || true
            sudo pkill -9 -f dpkg || true
            sudo rm -f /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/lib/apt/lists/lock || true
            sudo dpkg --configure -a || true
          done
          echo "::error::playwright browser install failed after 3 attempts"
          exit 1

      # Fonts only (see above). Bounded and NON-FATAL: a failure here costs
      # glyph fidelity in failure screenshots, never a working browser. If a
      # runtime library ever does go missing, the browser fails to launch in
      # the E2E step below — loudly, and with a message about the browser
      # rather than about apt.
      - name: Install Playwright fonts (cached browser)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        timeout-minutes: 6
        continue-on-error: true
        run: npx playwright install-deps chromium

      # ── GAP-20: accessibility gate ──
      # The a11y spec runs first as a NAMED step so its pass/fail
      # signal is visible at a glance in the CI annotation, separate
      # from the broader functional E2E suite. The spec itself
      # (`tests/e2e/a11y.spec.ts`) hard-fails on `serious` and
      # `critical` axe violations across login, dashboard, the four
      # main list pages, coverage, and the create-control modal.
      # `moderate` and `minor` findings are LOGGED for triage but
      # do not block — the policy is intentional, see the docblock
      # at the top of the spec.
      - name: "Gate: accessibility (axe) — GAP-20"
        # a11y.spec.ts is a SINGLE file; with fullyParallel:false Playwright
        # shards by file, so `--shard` would hand the whole file to one shard
        # and fail the other with "no tests found". Pin the full a11y gate to
        # shard 1 (mirrors how the jest matrix pins its guards to shard 1).
        if: matrix.shard == 1
        run: npx playwright test tests/e2e/a11y.spec.ts
        env:
          CI: "true"

      - name: Run E2E tests
        # Skip the a11y spec here — run as the gate above. The functional
        # suite spans many files, so `--shard=i/2` splits them evenly.
        #
        # ── #748: budget this step BELOW the job, the same way the `test`
        #    job budgets jest ──
        # `timeout-minutes: 40` does not fail this job, it CANCELS it, and a
        # cancelled job skips every step whose `if:` lacks `always()` /
        # `cancelled()` — so the two uploads below produced nothing, and the
        # un-flushed log buffer went with the runner. That is how `fc71d0ff`
        # reported `cancelled` while concealing two genuine test failures:
        # `cancelled` reads as infrastructure noise, so main was left
        # unverified and nobody looked.
        #
        # A shell timeout converts the overrun into a step FAILURE with its
        # log intact — identical mechanism and rationale to the jest budget
        # at the `test` job above. `--signal=INT` matters for Playwright
        # specifically: on SIGINT it shuts down gracefully and still writes
        # its HTML report and summary, so the artifact uploads have something
        # to carry. `--kill-after=60s` is the backstop if it does not.
        #
        # 25m against a 40m job: the slowest healthy shard observed is
        # ~6m of Playwright (setup accounts for the rest of the job), while
        # every recorded overrun sat at 32-37m. So this fires only on the
        # pathological case and leaves ~6m for the uploads.
        run: |
          status=0
          timeout --signal=INT --kill-after=60s 25m \
            npx playwright test --grep-invert "a11y" --shard=${{ matrix.shard }}/2 || status=$?

          if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
            echo "::error::E2E shard ${{ matrix.shard }} exceeded its 25-minute budget."
            echo "::error::Failing the step rather than letting the job time out, so the"
            echo "::error::Playwright report and traces below still upload and the log survives."
            exit 1
          fi
          exit "$status"
        env:
          CI: "true"

      # ── Artifacts (always on non-success) ──
      # `failure() || cancelled()`, not `failure()`: the header has always
      # claimed "on non-success", and a cancellation is the non-success whose
      # diagnosis is otherwise unavailable. The step budget above should mean
      # this job now fails rather than cancels — this is the backstop for the
      # cancellations it cannot catch (pathological setup, a manual cancel).
      # `always()` would pay artifact storage on every green run instead.
      - name: Upload Playwright HTML report
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7
        continue-on-error: true

      - name: Upload test results (traces, screenshots, videos)
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results-shard-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
        continue-on-error: true

  # E2E aggregation gate — the SINGLE required-check context named "E2E".
  # The matrix jobs above report as "E2E (shard N/2)" (which are NOT required
  # contexts); this job rolls their combined result into one stable status so
  # branch protection keeps requiring just "E2E" regardless of shard count.
  # `needs.e2e-shard.result` is the matrix aggregate: success only if ALL
  # shards passed, failure if any failed. Passes on success OR skipped
  # (content-only change → the shards' own `if` skips them); fails otherwise.
  e2e:
    name: E2E
    needs: [e2e-shard]
    # Mirror the Test (summary) gate: run unless cancelled, skip on schedule.
    # Unlike the Test matrix, the e2e shards ALSO skip on content-only changes
    # (their own `if`), so `skipped` must count as a pass here.
    if: ${{ !cancelled() && github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate E2E shard results
        run: |
          result="${{ needs.e2e-shard.result }}"
          echo "e2e-shard matrix result: $result"
          case "$result" in
            success|skipped) echo "E2E OK ($result)"; exit 0 ;;
            *) echo "::error::E2E failed — shards reported '$result'"; exit 1 ;;
          esac

  # ═══════════════════════════════════════════════════════════════
  #  Job 6.5: Load Smoke — k6 mutation smoke (10 VUs × 30s)
  #
  #  Runs on every PR + push to main. Catches obvious latency / error
  #  regressions in the highest-traffic mutation paths (practice create,
  #  evidence upload) before merge. Full-scale baselines stay in the
  #  on-demand load-test.yml workflow (50 / 100 / 200 VU).
  #
  #  Thresholds (from tests/load/mutations.js, must stay in sync):
  #    p95 < 1500ms (create_practice), 2000ms (upload_evidence)
  #    p99 < 3000ms / 4000ms
  #    error-rate < 2% per op, check-rate > 98%
  #
  #  Needs: build (no point smoking the app if it doesn't compile).
  # ═══════════════════════════════════════════════════════════════
  load-smoke:
    name: "Load Smoke (k6)"
    needs: [build, changes]
    # Main-push only (skips PRs entirely) and only when code changed — running
    # actual load per-PR is redundant; the merge to main exercises it. Not on
    # schedule (scanning-refresh runs stay lean).
    #
    # CONSEQUENCE, learned the hard way: a k6 CONFIG error is undetectable
    # before merge here. An invalid threshold aggregation made every script a
    # parse error, this job exited at init, and `main` stayed red across three
    # merges. Script VALIDITY is therefore checked on PRs by
    # `tests/guards/k6-threshold-binding.test.ts`, which runs in the `test`
    # job; this job checks BEHAVIOUR. Do not assume a green PR means the load
    # scripts run — that is the guard's job, not this one's.
    if: ${{ github.event_name == 'push' && needs.changes.outputs.code == 'true' }}
    runs-on: ${{ vars.LARGE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 12

    env:
      AUTH_TEST_MODE: "1"
      AUTH_TRUST_HOST: "1"
      AUTH_SECRET: "test-auth-secret-that-is-long-enough-32chars" # pragma: allowlist secret — test-only stub for the load-smoke CI job
      JWT_SECRET: "test-auth-secret-that-is-long-enough-32chars" # pragma: allowlist secret — test-only stub for the load-smoke CI job
      AUTH_URL: "http://localhost:3006"
      DATABASE_URL: postgresql://ci:ci_password@localhost:5432/ci_testdb?schema=public
      DATABASE_URL_TEST: postgresql://ci:ci_password@localhost:5432/ci_testdb?schema=public
      DIRECT_DATABASE_URL: postgresql://ci:ci_password@localhost:5432/ci_testdb?schema=public
      # GAP-13: `next start` refuses to boot in prod mode without
      # REDIS_URL. The previous RATE_LIMIT_ENABLED=0 escape hatch was
      # removed (see src/instrumentation.ts) — Redis underpins more
      # than rate-limiting. The redis service container below
      # satisfies the boot check; RATE_LIMIT_ENABLED stays "0" so
      # 429 backpressure doesn't interfere with mutation-throughput
      # measurements.
      REDIS_URL: redis://localhost:6379
      RATE_LIMIT_ENABLED: "0"
      DATA_ENCRYPTION_KEY: ci-test-data-encryption-key-32-chars-or-more-deterministic-x

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ci_testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci -d ci_testdb"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v7

      - name: Setup environment
        run: cp .env.e2e.example .env

      - name: Setup Node + Prisma client
        uses: ./.github/actions/setup-node-prisma
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      # ── Create roles required by RLS migrations ──
      - name: Create PostgreSQL roles for RLS
        run: |
          PGPASSWORD=ci_password psql -h localhost -U ci -d ci_testdb <<'SQL'
          DO $$ BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'app_user') THEN CREATE ROLE app_user NOLOGIN; END IF;
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'postgres') THEN CREATE ROLE postgres NOLOGIN; END IF;
          END $$;
          GRANT app_user TO ci;
          GRANT app_user TO postgres;
          SQL

      - name: Enable pgvector (PGDG)
        uses: ./.github/actions/enable-pgvector
      - name: Apply Prisma migrations
        run: ./node_modules/.bin/prisma migrate deploy

      - name: Seed test database
        run: npx tsx prisma/seed.ts

      - name: Create upload + results directories
        # .env.e2e.example points UPLOAD_DIR / FILE_STORAGE_ROOT at
        # `./tmp/test-uploads` (matching the e2e job's convention).
        # tests/load/results/ is where mutations.js writes its summary
        # JSON in handleSummary(); without it k6 logs a "no such file"
        # error and the artifact upload step has nothing to collect.
        run: |
          mkdir -p tmp/test-uploads
          mkdir -p tests/load/results

      # Incremental-build cache (plain `.next/` build — no test mode).
      # SAFE: build still runs; only the webpack module cache is reused.
      - name: Cache Next.js build cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextcache-loadsmoke-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nextcache-loadsmoke-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build Next.js app
        # Do NOT set NEXT_TEST_MODE=1 here. next.config.js routes the
        # build to `.next-test/` when that env is set; this job runs
        # `next start` directly (no Playwright shim), so the build
        # must land in the default `.next/` directory the start
        # command reads from. The e2e job uses NEXT_TEST_MODE because
        # Playwright's runner expects the test-mode artifact path.
        # --webpack: match the deployed bundler (nonce strict-CSP chunks).
        run: npx next build --webpack
        env:
          # `next build` sits near the runner's default ~2 GB V8 heap ceiling
          # and OOMs on the private-repo runners; lift it as the jest/tsc jobs do.
          NODE_OPTIONS: --max-old-space-size=8192
          NODE_ENV: production

      - name: Start app (background)
        run: |
          nohup npx next start -p 3006 > /tmp/app.log 2>&1 &
          echo $! > /tmp/app.pid

      - name: Wait for /api/health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3006/api/health > /dev/null 2>&1; then
              echo "App is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::App failed to start within 60s. Last 100 lines of log:"
          tail -n 100 /tmp/app.log || true
          exit 1

      # ── k6 smoke: 10 VUs × 30s mutation scenario ──
      # The script's own thresholds gate the run (p95/p99 latency,
      # error rate, check rate). A breach exits non-zero → CI fails.
      - name: "Gate: k6 mutation smoke"
        run: |
          k6 run \
            -e VUS=10 \
            -e DURATION=30s \
            -e RAMP_UP=5s \
            -e RAMP_DOWN=5s \
            -e RUN_ID=ci-${{ github.run_id }}-${{ github.run_attempt }} \
            tests/load/mutations.js

      - name: "Gate: k6 ag parcel-list smoke"
        run: k6 run -e VUS=10 -e DURATION=20s -e RAMP_UP=5s -e RAMP_DOWN=5s -e RUN_ID=ci-${{ github.run_id }}-parcel tests/load/ag-parcel-list.js

      - name: "Gate: k6 ag inventory-pagination smoke"
        run: k6 run -e VUS=10 -e DURATION=20s -e RAMP_UP=5s -e RAMP_DOWN=5s -e RUN_ID=ci-${{ github.run_id }}-inv tests/load/ag-inventory-pagination.js

      - name: Stop app
        if: always()
        run: |
          if [ -f /tmp/app.pid ]; then
            kill "$(cat /tmp/app.pid)" 2>/dev/null || true
          fi

      - name: Upload k6 + app logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: load-smoke-results-${{ github.run_id }}
          path: |
            tests/load/results/*.json
            /tmp/app.log
          retention-days: 14
        continue-on-error: true

  # ═══════════════════════════════════════════════════════════════
  #  Job 7: Security — supply chain and dependency checks
  #  npm audit is BLOCKING for high+ severity vulnerabilities.
  # ═══════════════════════════════════════════════════════════════
  security:
    name: Security
    runs-on: ubuntu-latest
    # 10, not 5: the install step retries up to 3x at 150s each, so the
    # worst case is ~8 min of install + ~40s of scanning. At 5 the job
    # died before the second attempt could finish, which defeated the
    # retry it was meant to backstop. Normal runtime is 1.4-1.7 min —
    # this bound is a runaway backstop, not a performance budget.
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      # ── Dependency review (PR only) ──
      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: always

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        # CI hardening — retry npm ci so a flaky postinstall binary
        # download (e.g. onnxruntime-node ETIMEDOUT from an external
        # CDN) doesn't fail the job. npm ci wipes node_modules each run,
        # so retrying is clean.
        #
        # `timeout` is load-bearing, not decoration. Without a
        # per-attempt cap this loop only re-enters when npm ci RETURNS,
        # so it defends against a fast failure but not against a hang —
        # which is what actually happened in release.yml on 2026-07-31
        # (npm ci stalled ~8 min, ate the job budget, attempts 2 and 3
        # never ran). Security is a REQUIRED check, so the same stall
        # here fails every PR. 150s is ~3x the observed normal install
        # (41-60s); -k KILLs a child that ignores TERM (postinstall
        # scripts do). Guarded by
        # tests/guardrails/ci-retry-loop-timeout.test.ts.
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-maxtimeout 120000
          npm config set fetch-timeout 300000
          for attempt in 1 2 3; do
            status=0
            timeout -k 10 150 npm ci || status=$?
            if [ "$status" -eq 0 ]; then exit 0; fi
            if [ "$status" -eq 124 ]; then
              echo "::warning::npm ci TIMED OUT after 150s (attempt ${attempt}/3) — retrying"
            else
              echo "::warning::npm ci failed with exit ${status} (attempt ${attempt}/3) — retrying"
            fi
            sleep 15
          done
          exit 1

      # ── Gate: lockfile integrity (deterministic, in-sync install) ──
      # `npm ci` already HARD-FAILS if package.json and
      # package-lock.json disagree (that is its contract vs `npm
      # install`), so a green install above is the first half of the
      # guarantee. This step closes the remaining gap: `npm ci` can
      # still silently NORMALISE the lockfile on disk (re-sort keys,
      # rewrite a drifted `resolved`/`integrity` field) without
      # erroring. `git diff --exit-code` fails the build if the
      # committed lockfile is not byte-identical to what a clean
      # install produces — i.e. the lockfile is stale and a
      # contributor forgot to commit the regenerated file. Combined
      # with the caret-free pins on the spatial-parse + map libs
      # (shpjs / @tmcw/togeojson / maplibre-gl) this makes the
      # dependency set reproducible build-over-build.
      - name: "Gate: lockfile integrity (deterministic install)"
        run: git diff --exit-code package-lock.json

      # ── Advisory: registry signature verification (supply-chain) ──
      # `npm audit signatures` verifies each installed package's
      # registry-published signature + attestation against the npm
      # public keys — surfacing a tampered tarball or compromised-
      # registry swap that the integrity-hash pin alone would not catch.
      # ADVISORY (continue-on-error), NOT a hard blocker: the npm
      # registry has not back-signed every legacy package *version*, so
      # an unsigned transitive dep is a normal state of the world, not
      # evidence of compromise — failing the build on it would be a
      # frequent false positive. The signature report still prints in
      # the CI log for review; the hard supply-chain blockers are the
      # lockfile-integrity gate above + the vulnerability `npm audit`
      # below + the Trivy container scan. Promote to blocking once the
      # dependency tree is confirmed fully signed.
      - name: "Advisory: npm registry signature verification"
        continue-on-error: true
        run: npm audit signatures

      # ── npm audit: BLOCKING on moderate+ severity (production deps) ──
      # `--omit=dev` scans only the runtime dependency tree, so a
      # MODERATE-or-higher finding here implies an exploitable
      # surface in shipped code. The bar was raised from HIGH+ to
      # MODERATE+ deliberately — moderate-severity CVEs in production
      # deps (postcss XSS, hono middleware bypass, otel/protobuf
      # decoding bugs) are the exact failure mode this gate exists
      # to prevent.
      #
      # Lowering this gate (back to `--audit-level=high` or
      # `=critical`) is a regression —
      # `tests/guardrails/security-gate-strictness.test.ts` fails CI
      # if the gate weakens. If a specific advisory genuinely cannot
      # be fixed today, add a tracked exemption with a written
      # rationale + upgrade plan rather than relaxing the global gate.
      - name: "Gate: npm audit (moderate+ blocks merge)"
        # The gate itself is UNCHANGED and runs first, verbatim — the
        # threshold is still moderate+ and `security-gate-strictness`
        # still sees this exact command. Only when it fails do we
        # consult the per-ADVISORY exemption list, which is the escape
        # hatch the comment above prescribes ("a tracked exemption with
        # a written rationale" rather than relaxing the global gate).
        #
        # scripts/audit-exemptions.mjs exits non-zero unless EVERY
        # remaining moderate+ advisory is listed by GHSA id with a
        # reachability argument — and ALSO fails on a stale entry, so
        # the list cannot rot into a permanent blind spot once upstream
        # ships a fix.
        run: |
          # ONE audit, ONE verdict. This used to be
          #   npm audit --omit=dev --audit-level=moderate || node scripts/audit-exemptions.mjs
          # which ran TWO separate audits and put every safety check on the
          # RHS of the `||`. Both halves were measurably unsafe:
          #
          #   · a registry answering the bulk advisory endpoint `200 {}` makes
          #     the GATE ITSELF exit 0 ("found 0 vulnerabilities"), so `||`
          #     short-circuits and the exemption script never runs at all;
          #   · a registry that degrades BETWEEN the two calls lets a genuine
          #     real-advisory failure be overwritten by a clean second read —
          #     reproduced end-to-end over 2 critical + 3 moderate advisories.
          #
          # Capturing once and handing the script those exact bytes removes
          # both by construction: no short-circuit, no flap window, and half
          # the registry exposure. `|| true` is safe ONLY because the script
          # fails closed on an empty, truncated, malformed or blind report —
          # see scripts/audit-exemptions.mjs.
          #
          # `--audit-level=moderate` is retained deliberately. It is the policy
          # this repo gates on, and tests/guardrails/security-gate-strictness.test.ts
          # greps this file for that literal.
          npm audit --omit=dev --audit-level=moderate --json > "$RUNNER_TEMP/audit.json" || true
          AUDIT_JSON_OVERRIDE="$RUNNER_TEMP/audit.json" node scripts/audit-exemptions.mjs

      # ── Full audit (informational — dev deps included) ──
      - name: "Info: npm audit (all deps)"
        run: npm audit --audit-level=critical 2>&1 || echo "::warning::npm audit found vulnerabilities in dev dependencies (see above)"
        continue-on-error: true

  # ═══════════════════════════════════════════════════════════════
  #  Job 8: CodeQL — SAST (Static Application Security Testing)
  #  Scans JavaScript/TypeScript for security vulnerabilities.
  #  Runs on every PR and push to main.
  # ═══════════════════════════════════════════════════════════════
  codeql:
    name: "CodeQL SAST"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Code Scanning is enabled on this repo (public + Advanced
    # Security free). The `continue-on-error: true` guard was added
    # as a workaround pre-enablement; it's no longer needed and was
    # also responsible for the "Code scanning configuration error"
    # banner on the Security tab — failed uploads emitted warnings
    # that the UI surfaced as configuration errors even though the
    # workflow itself succeeded. With the guard removed, SARIF
    # upload failures (which should not happen) will fail the job
    # loudly and we'll see them as actual CI failures, not silent
    # Security-tab warnings.

    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.9
        with:
          languages: ${{ matrix.language }}
          # `.github/codeql/codeql-config.yml` pins the language list,
          # paths-ignore, and query suite. Removes the autodetection
          # mismatch that produced the configuration-error banner —
          # autodetection thought the repo needed `actions` +
          # `javascript` + `typescript` scans on top of
          # `javascript-typescript`; the config file makes the
          # workflow's scope explicit and matches what gets uploaded.
          config-file: ./.github/codeql/codeql-config.yml

      # CodeQL auto-builds JavaScript/TypeScript — no manual build needed.
      # The autobuild step handles source extraction.
      - name: Autobuild
        uses: github/codeql-action/autobuild@v4.37.9

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.9
        with:
          category: "/language:${{ matrix.language }}"

  # ═══════════════════════════════════════════════════════════════
  #  Job 9: Docker — verify Dockerfile builds correctly
  #  Needs: build (no point testing Docker if app doesn't compile)
  # ═══════════════════════════════════════════════════════════════
  docker:
    name: "Docker Build & Scan"
    needs: [build, changes]
    # Runs on the weekly scan (Trivy SARIF refresh) OR whenever code changed.
    # A content-only PR (docs/messages/md) leaves the image unchanged, so skip
    # it — the last Trivy result stands and the cron refreshes it weekly.
    # Also skipped in the merge queue: a ~21-minute image build and scan is the
    # single most expensive check, and a merge collision does not manifest as a
    # container-scan finding. It still runs on the PR and again on main.
    if: ${{ github.event_name != 'merge_group' && (github.event_name == 'schedule' || needs.changes.outputs.code == 'true') }}
    runs-on: ${{ vars.LARGE_RUNNER || 'ubuntu-latest' }}
    # Roadmap-27 CI hardening — bumped 15 → 25. semantic-release
    # bumps the package.json version on every release, which
    # cache-misses the Docker `npm ci` layer; a cold full install
    # pushes this job past 15 min and the run is cancelled. GHA
    # layer caching is already enabled (cache-from/to: gha) — the
    # cold npm-ci layer after a version bump is unavoidable.
    #
    # This job now ALSO runs the Trivy image scan (folded in from the
    # former standalone `trivy` job) so the image is built ONCE and
    # scanned in place — no redundant rebuild. +5 min over the old
    # 25-min build budget covers the gating scan + SARIF upload.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      # Issue #1005 — reclaim runner disk space. ubuntu-latest ships
      # ~14 GB free; the multi-stage image build plus Trivy's
      # uncompressed-image copy to /tmp need more, and 2026-06-11
      # logged seven 'no space left on device' flakes across Docker
      # Build + Trivy on otherwise-green runs. Dropping the unused
      # preinstalled toolchains reclaims ~25-30 GB. Inline rm -rf of
      # documented runner-image paths only — deliberately NOT a
      # third-party action (supply-chain surface).
      - name: Free runner disk space (issue #1005)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force 2>/dev/null || true
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image (no push)
        # ── #748, second job type ──
        # This step ran 31m49s against the job's `timeout-minutes: 30` on
        # `212bafbd` and cancelled the job. Durations over the preceding 14
        # runs were 10-20m, so the outlier is ~1.6x the worst normal build.
        # A STEP budget fails the step instead, which keeps the job in
        # `failure` rather than `cancelled` — the distinction the notifier
        # and every human reader use to decide whether to investigate.
        # No shell wrapper here: this is a `uses:` action, so `timeout` has
        # nothing to wrap.
        timeout-minutes: 24
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: inflect-compliance:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Export to local Docker daemon for Trivy scanning
          load: true

      # ── Gate: the IMAGE applied patch-package ──
      # Runs against the image already loaded above (`load: true`), so it
      # costs no extra build — same reasoning that folded Trivy into this
      # job. Placed BEFORE the scan so a delivery bug fails in seconds
      # rather than after a multi-minute vulnerability scan.
      #
      # This is the only check in the repo that reads the ARTIFACT. From
      # 2026-05-14 to 2026-07-25 every deployed container served an
      # unnonced <script> (blocked by our nonce + strict-dynamic CSP)
      # while CI stayed green, because the Dockerfile copied only
      # package.json + package-lock.json before `npm ci` and
      # patch-package logged "No patch files found". The guard tests read
      # the LOCAL node_modules, where the patch DOES apply — so locally
      # patched / in-image unpatched produced no contradiction anywhere.
      # A Dockerfile-shape assertion is a proxy; this is not.
      - name: "Gate: image applied the CSP-nonce patch"
        run: |
          docker run --rm --entrypoint node \
            -v "$PWD/scripts/verify-image-patches.mjs:/verify.mjs:ro" \
            inflect-compliance:ci-${{ github.sha }} /verify.mjs

      # ── Trivy scan: BLOCKING on CRITICAL,HIGH ──
      # Runs in the SAME job as the build above — the image is already
      # loaded into the local daemon (`load: true`), so there is NO
      # second rebuild. This merge removed the former standalone `trivy`
      # job's ~7.5-min redundant image rebuild + its runner spin-up /
      # disk-cleanup / buildx-setup, and the inter-job scheduling gap.
      #
      # Container-image scan against OS packages + bundled libraries.
      # Dropping HIGH from the severity list (CRITICAL-only) is a
      # regression — `tests/guardrails/security-gate-strictness.test.ts`
      # fails CI if the gate weakens.
      #
      # `.trivyignore` carries narrow per-CVE exemptions with written
      # reasons + upgrade plans. Exemption entries are the structural
      # escape hatch; never weaken the global severity threshold.
      # (Currently: CVE-2026-33671 in the bundled npm CLI's picomatch,
      # not exploitable from app code; tracked for upgrade in the next
      # Node base-image bump.)
      - name: "Gate: Trivy vulnerability scan (critical+high)"
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "inflect-compliance:ci-${{ github.sha }}"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          vuln-type: "os,library"
          trivyignores: ".trivyignore"

      # ── SARIF upload for GitHub Security tab (informational) ──
      - name: "Trivy SARIF report (all severities)"
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "inflect-compliance:ci-${{ github.sha }}"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH,MEDIUM"
          ignore-unfixed: true
          vuln-type: "os,library"

      - name: Upload Trivy SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v4.37.9
        with:
          sarif_file: "trivy-results.sarif"
          category: "trivy-container-scan"
        # `continue-on-error: true` removed (same reasoning as the
        # CodeQL job above): the upload now needs to either succeed
        # or fail the job loudly. Silent upload failures were
        # showing up as "Code scanning configuration error" banners
        # on the Security tab without breaking CI.
