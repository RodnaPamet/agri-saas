# ───────────────────────────────────────────────────────────────
#  Restore Test — monthly restore drill against the REAL backup
#
#  Proves the production backups are restorable, not merely present.
#  Runs infra/scripts/restore-test-gcp.sh once per target, restoring
#  the newest GCE snapshot of that target's boot disk onto a throwaway
#  VM, booting a real Postgres over the recovered data directory,
#  running a validation battery (migrations / RLS policies / app_user /
#  recent audit rows), and deleting everything from a trap.
#
#  ## Two targets
#
#  The project runs two independent stacks in one GCP project:
#
#    agrent              THIS repo's deployment (ghcr.io/…/agri-saas)
#    inflect-compliance  a DIFFERENT product, from a different repo
#
#  Both are drilled here because the tooling and the backup mechanism
#  live here — not because the code is shared. Both had zero backups
#  until 2026-08-01.
#
#  ## Why this replaced the AWS version
#
#  Until 2026-08-01 this workflow drilled AWS RDS point-in-time
#  recovery. The product does not run on RDS — production is a single
#  GCE VM (project hazel-design-419410, instance `agrent`) with
#  Postgres in a local Docker volume. The workflow died at
#  "Configure AWS credentials (OIDC)" in 12 seconds on every run,
#  because the AWS account it assumed does not exist, and so the
#  restore script it existed to run was never executed once.
#
#  Worse, the failure was uninformative: it read as "restore is
#  broken" when it meant "this drills infrastructure we do not have".
#  What it actually masked was that production had NO automated
#  backups at all — no cron, no systemd timer, no snapshot schedule,
#  zero snapshots. Neither stack had any. That is fixed (resource
#  policies `agrent-daily-snapshot` at 02:00 UTC and
#  `inflect-daily-snapshot` at 02:30 UTC, both 14-day retention), and
#  this workflow is what keeps it honest.
#
#  ## Required configuration
#
#  Repo Settings → Environments → production:
#    Secrets:
#      GCP_WORKLOAD_IDENTITY_PROVIDER — full provider resource name,
#        projects/<num>/locations/global/workloadIdentityPools/<pool>/providers/<provider>
#      GCP_SERVICE_ACCOUNT            — service account email the
#        workflow impersonates. Needs compute.instances.*,
#        compute.disks.*, compute.snapshots.get/list on the project.
#  Repo Variables (optional):
#    GCP_PROJECT (default hazel-design-419410)
#    GCP_ZONE    (default europe-west1-b)
#  Per-target settings are in the job matrix below, not in variables —
#  a single SOURCE_DISK variable cannot describe two targets.
#
#  Until those secrets exist the drill CANNOT run from CI, and this
#  workflow says so explicitly rather than failing somewhere opaque.
#  The script is not CI-only — the per-target invocation is printed in
#  that failure summary, and documented in docs/backup-restore.md.
# ───────────────────────────────────────────────────────────────
name: Restore Test

on:
  schedule:
    # 04:00 UTC on the 1st of every month — two hours after the daily
    # snapshot window (02:00 UTC), so the newest snapshot is settled
    # and comfortably inside the 26h freshness bound.
    - cron: "0 4 1 * *"
  workflow_dispatch:
    inputs:
      reason:
        description: "Why are you running this manually? (audit trail)"
        required: false
        default: "manual restore validation"

permissions:
  contents: read
  id-token: write # OIDC → Workload Identity Federation

concurrency:
  # One drill at a time — concurrent runs would burn quota and clutter
  # the disk/instance list.
  group: restore-test
  cancel-in-progress: false

jobs:
  restore-test:
    name: "Restore Test (${{ matrix.target }})"
    runs-on: ubuntu-latest
    # Snapshot → disk → VM boot → image build → WAL recovery. Normal
    # runtime is ~10 min; this is a runaway backstop, not a budget.
    timeout-minutes: 45
    environment: production # gates the GCP identity secrets

    strategy:
      # Both targets must report. fail-fast would cancel the second
      # drill the moment the first failed, which is precisely when you
      # most want to know whether the other backup is also broken.
      fail-fast: false
      # Serialised: the drill names its temporary disk and VM from a
      # to-the-second timestamp, so two legs starting in the same
      # second would collide. It also halves the peak quota draw.
      max-parallel: 1
      matrix:
        include:
          # This repo's own deployment (ghcr.io/…/agri-saas).
          - target: agrent
            disk: agrent
            schedule: agrent-daily-snapshot
            pgdata_volume: agrent-pgdata
            stack_dir: /opt/agrent
            # empty ⇒ build postgis+pgvector, which this cluster needs
            pg_image: ""
          # A DIFFERENT product, from a different repo, sharing this
          # GCP project and this backup mechanism. It is drilled here
          # because the tooling lives here — not because the code is
          # shared. If that repo grows its own drill, drop this entry.
          - target: inflect-compliance
            disk: inflect-compliance
            schedule: inflect-daily-snapshot
            pgdata_volume: inflect_pgdata
            stack_dir: /opt/inflect
            pg_image: postgres:16-alpine

    steps:
      - uses: actions/checkout@v7

      # Fail with a NAMED diagnosis rather than dying inside the auth
      # action. The previous workflow's whole problem was that its
      # failure did not say what was wrong.
      - name: Preflight — is the drill configured for CI?
        env:
          WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          WIF_SA: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: |
          missing=""
          [ -n "$WIF_PROVIDER" ] || missing="$missing GCP_WORKLOAD_IDENTITY_PROVIDER"
          [ -n "$WIF_SA" ]       || missing="$missing GCP_SERVICE_ACCOUNT"
          if [ -n "$missing" ]; then
            echo "::error title=Restore drill not configured::Missing production environment secret(s):$missing"
            {
              echo "## ⚠ Restore drill did not run"
              echo ""
              echo "Missing production environment secret(s):**$missing**"
              echo ""
              echo "CI has no credentials for the production GCP project, so the"
              echo "monthly restore drill could not execute. **This is not a"
              echo "statement that the backup is good — it is a statement that"
              echo "nobody checked.**"
              echo ""
              echo "Either configure Workload Identity Federation (see the header"
              echo "of \`.github/workflows/restore-test.yml\`), or run the drill"
              echo "manually from an authenticated shell:"
              echo ""
              echo '```'
              echo "GCP_PROJECT=${{ vars.GCP_PROJECT || 'hazel-design-419410' }} \\"
              echo "GCP_ZONE=${{ vars.GCP_ZONE || 'europe-west1-b' }} \\"
              echo "SOURCE_DISK=${{ matrix.disk }} SNAPSHOT_SCHEDULE=${{ matrix.schedule }} \\"
              echo "PGDATA_VOLUME=${{ matrix.pgdata_volume }} STACK_DIR=${{ matrix.stack_dir }} \\"
              echo "PG_IMAGE=${{ matrix.pg_image }} \\"
              echo "  ./infra/scripts/restore-test-gcp.sh"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "✓ GCP identity secrets present"

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Run the restore drill
        env:
          GCP_PROJECT: ${{ vars.GCP_PROJECT || 'hazel-design-419410' }}
          GCP_ZONE: ${{ vars.GCP_ZONE || 'europe-west1-b' }}
          SOURCE_DISK: ${{ matrix.disk }}
          SNAPSHOT_SCHEDULE: ${{ matrix.schedule }}
          PGDATA_VOLUME: ${{ matrix.pgdata_volume }}
          STACK_DIR: ${{ matrix.stack_dir }}
          PG_IMAGE: ${{ matrix.pg_image }}
        run: ./infra/scripts/restore-test-gcp.sh

      - name: Workflow summary
        if: always()
        run: |
          {
            echo "## Restore Test"
            echo ""
            echo "- **Triggered by:** ${{ github.event_name }}"
            echo "- **Reason:** ${{ github.event.inputs.reason || 'scheduled' }}"
            echo "- **Target:** ${{ matrix.target }} — disk \`${{ matrix.disk }}\`, schedule \`${{ matrix.schedule }}\` (${{ vars.GCP_ZONE || 'europe-west1-b' }})"
            echo "- **Result:** ${{ job.status }}"
            echo "- **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            if [ "${{ job.status }}" != "success" ]; then
              echo "### ⚠ Action required"
              echo ""
              echo "The production backup did not restore cleanly. Investigate before"
              echo "the next maintenance window — this is the only signal that stands"
              echo "between a snapshot schedule and an unrecoverable database."
              echo ""
              echo "The drill's cleanup trap deletes the throwaway VM and disk on every"
              echo "exit path. If it was killed hard, check for leaked resources:"
              echo ""
              echo '```'
              echo "gcloud compute instances list --filter='name~restore-test-'"
              echo "gcloud compute disks list --filter='name~restore-test-'"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
