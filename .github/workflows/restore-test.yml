# Restore drill — can the production backup actually be restored? (#2332)
#
# REPLACES a drill against a GCE snapshot schedule. That mechanism was
# deliberately deleted on 2026-10-12 (#2329), so the old workflow's first two
# assertions — schedule attached, newest snapshot under 26h — now fail on a
# mechanism that no longer exists. It would have gone red on 2026-11-01 for a
# stale reason, and a monthly job that is red for the wrong reason is worse
# than no job: it teaches everyone to ignore the one check whose entire value
# is being believed.
#
# ═══ WHAT CHANGED, AND WHAT THAT BUYS ═══
#
# The old drill created a disk from the snapshot, booted a throwaway VM,
# mounted the disk and let Postgres perform WAL recovery over the recovered
# data directory — the crash-consistent snapshot's correctness argument. A
# `pg_dump` has no WAL to recover and no disk to boot; it is already
# application-consistent, which is why it was chosen.
#
# So those steps are gone, and with them a failure family this drill's own
# history records: 2026-09-01 reported `exit 75 — NOT TESTED` because BOTH
# targets hit `ZONE_RESOURCE_POOL_EXHAUSTED` for a pd-balanced disk. A drill
# that cannot get hardware cannot report on backups. This one needs none —
# a container in the runner is the whole environment — so the EX_TEMPFAIL
# path that existed for that case is deliberately NOT carried over. It is
# unreachable now, and a branch for an impossible state is a lie in waiting.
#
# ═══ WHY THERE IS ONLY ONE TARGET NOW ═══
#
# The old matrix drilled `agrent` AND `inflect-compliance`, "because the
# tooling lives here — not because the code is shared".
#
# `inflect-compliance` HAS NO BACKUP. Its snapshot schedule went in the same
# 2026-10-12 sweep and nothing replaced it: zero snapshots, no bucket, no
# timer (measured 2026-10-25, #2329). There is nothing to restore, so a leg
# for it could only ever report its own impossibility — monthly, in red, for
# something this repository cannot fix.
#
# It is therefore removed from the matrix rather than left to fail, and the
# absence is RECORDED instead of dropped: `docs/backup-restore.md` states it
# in the section that used to describe the shared mechanism, and
# `tests/guards/restore-drill-targets-what-exists.test.ts` asserts the two
# statements agree — so the day that stack grows a backup, the guard is what
# notices this file never gained a target.
name: Restore Test

on:
  schedule:
    # 04:00 UTC on the 1st. The nightly dump lands at 01:15 UTC, so by now it
    # is settled. Freshness itself is NOT this drill's gate — the daily
    # `Backup exists` probe owns that question (#2329), because the monthly
    # cadence is what let a total absence of backups go unreported for 13 days.
    - cron: "0 4 1 * *"
  workflow_dispatch:
    inputs:
      reason:
        description: "Why are you running this manually? (audit trail)"
        required: false
        default: "manual restore validation"

permissions:
  contents: read
  id-token: write # OIDC → Workload Identity Federation

concurrency:
  group: restore-test
  cancel-in-progress: false

jobs:
  restore-test:
    name: "Restore Test (agrent)"
    runs-on: ubuntu-latest
    # Image build + container start + a 54 MB restore. Normal runtime is a
    # few minutes; this is a runaway backstop, not a budget.
    timeout-minutes: 30
    environment: production # gates the GCP identity secrets

    steps:
      - uses: actions/checkout@v7

      # A named diagnosis rather than dying inside the auth action, and it
      # exits NON-ZERO: unconfigured is "nobody checked", which must never be
      # mistaken for "the backup restores". Checks the OIDC endpoint too,
      # because the secrets being present says nothing about whether a token
      # can be minted from them — that gap cost the Backup exists probe its
      # first CI run (#2334).
      - name: Preflight — is the drill configured for CI?
        env:
          WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          WIF_SA: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          BUCKET: ${{ vars.BACKUP_BUCKET }}
        run: |
          missing=""
          [ -n "$WIF_PROVIDER" ] || missing="$missing GCP_WORKLOAD_IDENTITY_PROVIDER"
          [ -n "$WIF_SA" ]       || missing="$missing GCP_SERVICE_ACCOUNT"
          [ -n "$BUCKET" ]       || missing="$missing BACKUP_BUCKET(repo-variable)"
          [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] \
            || missing="$missing id-token:write(permissions-block,-not-a-secret)"
          if [ -n "$missing" ]; then
            echo "::error title=Restore drill not configured::Missing:$missing"
            {
              echo "## ⚠ The restore drill did not run"
              echo ""
              echo "Missing: **$missing**"
              echo ""
              echo "**This is not a statement that the backup restores —"
              echo "it is a statement that nobody checked.**"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "configured"

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      # The SAME Dockerfile the production `db` service builds from — its own
      # header names "CI's restore drill" as one of its three consumers. The
      # dump carries postgis, vector and pg_trgm extension objects, so a stock
      # postgres image would fail the restore on CREATE EXTENSION and the
      # failure would look like a corrupt backup.
      - name: Build the Postgres image production runs
        run: docker build -t restore-drill-pg:local deploy/postgres

      - name: Restore the newest dump and validate it
        id: drill
        env:
          BACKUP_BUCKET: ${{ vars.BACKUP_BUCKET }}
          BACKUP_PREFIX: agrent/
          PG_IMAGE: restore-drill-pg:local
        run: ./infra/scripts/restore-test-dump.sh

      - name: Workflow summary
        if: always()
        run: |
          {
            if [ "${{ steps.drill.outcome }}" = "success" ]; then
              echo "## ✅ Restore drill passed"
              echo ""
              echo "The newest dump in \`${{ vars.BACKUP_BUCKET }}\` was restored into a"
              echo "clean Postgres built from \`deploy/postgres/Dockerfile\`, and the"
              echo "validation battery passed: migrations applied, \`tenant_isolation\`"
              echo "policies present, \`app_user\` present and holding table grants."
              echo ""
              echo "This says the backup RESTORES. Whether a recent one EXISTS is the"
              echo "daily \`Backup exists\` probe's question, not this drill's — see #2329."
            else
              echo "## ❌ Restore drill failed"
              echo ""
              echo "The step log carries a named diagnosis. The two causes worth"
              echo "telling apart:"
              echo ""
              echo "- **no dump, or no \`.globals.sql\` sibling** — that is a BACKUP"
              echo "  failure, not a drill failure. \`pg_dump\` omits roles while"
              echo "  emitting every GRANT that needs them, so a dump without its"
              echo "  globals cannot restore (#2337)."
              echo "- **the battery failed** — the dump restored but the result is not"
              echo "  a working database. Policies or grants missing means RLS would be"
              echo "  inert, which is a breach wearing a green tick."
            fi
            echo ""
            echo "\`inflect-compliance\` is NOT drilled: it has no backup mechanism at"
            echo "all since 2026-10-12 and there is nothing to restore. See"
            echo "\`docs/backup-restore.md\`."
          } >> "$GITHUB_STEP_SUMMARY"
