name: Flake ledger pointers

# Weekly: the TWO facts in the known-flake ledger that rot on wall-clock time.
#
#   1. does every entry still point at an OPEN issue?   (#1803)
#   2. has any entry reached its REVIEW DATE?           (#2966)
#
# The workflow keeps its original name because `ci-failure-issue.yml`'s watched
# list matches on it BY STRING and `ci-failure-watchlist.test.ts` derives that
# set from these files — so renaming it is a protection change, not a tidy-up.
#
# ## Why this is scheduled rather than a guard
#
# `tests/guards/known-flake-ledger.test.ts` checks everything about an entry
# that is visible offline — the spec exists, the title still occurs in it so a
# rename cannot orphan an entry, the review date is a real date. It can reach
# NEITHER fact above: the state of a GitHub issue is not in the repository, and
# whether a date has PASSED is not a property of the diff.
#
# Both rot on WALL-CLOCK TIME, not on a change: nobody edits the ledger on the
# day someone else closes the issue it names, and nobody edits it on the day a
# review date arrives. So the trigger has to be time, and it must not sit in
# the per-PR test population — a guard that needs the network fails closed on a
# rate limit, which is how a guard becomes one people disable.
#
# Measured before check 1 existed: FOUR of six entries pointed at closed issues
# (#1329 x3, #1487). An entry whose issue is closed reads as tracked while
# nothing tracks it, and goes on excusing a CI retry on every run. Check 2 was
# added because the dates were already in the ledger and no artefact read them.
#
# ## What a red run means — and what it does NOT mean
#
# A RED RUN means the probe itself is broken: the ledger moved, its shape
# changed, a date is unreadable, or an issue lookup could not be performed.
# That is why this workflow IS in `ci-failure-issue.yml`'s watched list — a
# broken probe is the silent-trigger class that notifier exists for.
#
# A FINDING is a different thing and never reaches that channel. Nothing is
# broken in the product; a pointer has gone stale, or a review date has
# arrived, and each wants a human decision. The script files its own issue
# PER CHECK and exits 0, so a finding stays out of a channel that means "main
# is broken". This comment used to say the workflow was "deliberately NOT in
# the watched list", which read as a claim about the workflow when it was only
# ever true of the findings — and would invite somebody to "add" a watch entry
# that has been there all along.

on:
    schedule:
        # Mondays 06:00 UTC — the start of a working week, and an hour before
        # the basemap probe so two scheduled jobs are not competing for
        # attention on the same morning.
        - cron: "0 6 * * 1"
    workflow_dispatch:

permissions:
    contents: read
    issues: write

concurrency:
    # A manual dispatch landing on top of the weekly run must not file twice:
    # both would lose the "does an issue already exist?" race.
    group: flake-ledger-pointers
    cancel-in-progress: false

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - name: Check out the ledger and the script
              uses: actions/checkout@v7
              with:
                  sparse-checkout: |
                      .github/scripts
                      tests/e2e/known-flakes.json
                  sparse-checkout-cone-mode: false

            - name: Report stale pointers and arrived review dates
              env:
                  GH_TOKEN: ${{ github.token }}
              run: ./.github/scripts/flake-ledger-pointers.sh
