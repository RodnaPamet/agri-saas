# ───────────────────────────────────────────────────────────────
#  Release — semantic versioning + changelog generation
#
#  Trigger: push to main (after CI passes)
#  Tool: semantic-release (conventional commits → SemVer)
#
#  What it does:
#    1. Analyzes commits since last release tag
#    2. Determines version bump (major/minor/patch) from commit types
#    3. Generates CHANGELOG.md entries
#    4. Creates a GitHub Release with release notes
#    5. Tags the commit with the version (e.g. v1.2.3)
#
#  COMMIT-BACK is opt-in (OFF by default). @semantic-release/git
#  pushes the bump directly to main, which branch protection rejects
#  for GITHUB_TOKEN (GH006 — required status checks). So publishing
#  (tag → refs/tags/*, unguarded; GitHub Release; SBOM) always runs,
#  but the in-repo bump of package.json / CHANGELOG.md / Chart.yaml is
#  SKIPPED unless a bypass-capable RELEASE_TOKEN secret is present.
#    • No RELEASE_TOKEN → versions freeze in-repo (in-sync, helm guard
#      green); history lives in git tags + GitHub Releases.
#    • Add RELEASE_TOKEN (fine-grained PAT contents:write from an admin,
#      or a GitHub App) → commit-back self-activates, versions advance
#      in lock-step. No workflow/config edit needed to switch it on.
#  release.config.js includes @semantic-release/git iff
#  SEMANTIC_RELEASE_COMMIT_BACK=true (set below from the token's presence).
#
#  Commit conventions used:
#    feat(scope): → minor bump
#    fix(scope):  → patch bump
#    perf(scope): → patch bump
#    BREAKING CHANGE: → major bump (or feat!:)
#    chore/refactor/test/docs: → no release (unless grouped)
#
#  This workflow is SEPARATE from deploy — a release does not
#  trigger a deployment. Deploy is triggered by CI completion.
# ───────────────────────────────────────────────────────────────
name: Release

on:
  push:
    branches: [main]

# Only one release at a time
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write      # create tags, releases, push changelog
  issues: write        # comment on released issues
  pull-requests: write # comment on released PRs

jobs:
  release:
    name: "Semantic Release"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only release from main — skip release-bot commits to prevent loops
    if: >
      github.ref == 'refs/heads/main' &&
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !contains(github.event.head_commit.message, '[skip release]') &&
      !contains(github.event.head_commit.message, 'chore(release)')

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # Full history for commit analysis
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        # CI hardening — retry npm ci so a flaky postinstall binary
        # download (e.g. onnxruntime-node ETIMEDOUT from an external
        # CDN) doesn't fail the job.
        #
        # `timeout` is load-bearing, not decoration. Without a
        # per-attempt cap this loop only re-enters when npm ci RETURNS,
        # so it defends against a fast failure but not against a hang.
        # On 2026-07-31 npm ci stalled silently for ~8 min here, ate the
        # whole `timeout-minutes` budget, and attempts 2 and 3 never ran
        # — the release for #463 was simply never cut. 150s is ~3x the
        # observed normal install (41-60s); -k KILLs a child that
        # ignores TERM (postinstall scripts do). Guarded by
        # tests/guardrails/ci-retry-loop-timeout.test.ts.
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-maxtimeout 120000
          npm config set fetch-timeout 300000
          for attempt in 1 2 3; do
            status=0
            timeout -k 10 150 npm ci || status=$?
            if [ "$status" -eq 0 ]; then exit 0; fi
            if [ "$status" -eq 124 ]; then
              echo "::warning::npm ci TIMED OUT after 150s (attempt ${attempt}/3) — retrying"
            else
              echo "::warning::npm ci failed with exit ${status} (attempt ${attempt}/3) — retrying"
            fi
            sleep 15
          done
          exit 1

      # Capture the newest release tag BEFORE semantic-release runs so
      # the SBOM step below can tell whether THIS run actually
      # published a new version (tag changed) vs. found nothing
      # release-worthy (tag unchanged). semantic-release has no
      # first-class "did it publish?" GHA output, and parsing its
      # stdout is brittle — the created git tag is the durable,
      # unambiguous signal.
      - name: Capture previous release tag
        id: prev_tag
        run: echo "tag=$(git describe --tags --abbrev=0 2>/dev/null || echo none)" >> "$GITHUB_OUTPUT"

      # ── SBOM (SPDX-JSON) generation — BEFORE semantic-release ──
      # anchore/sbom-action wraps syft; pinned to a release tag (not a
      # mutable major) so the supply-chain tooling itself is
      # reproducible. Scans the repository source tree (the built
      # `app`/`worker` images are produced + scanned separately by
      # Watchtower/Trivy on the deploy VM; the source SBOM is what we
      # attach to the GitHub Release for downstream consumers /
      # vulnerability-feed ingestion).
      #
      # IT RUNS BEFORE THE RELEASE, UNGATED, AND THAT ORDER IS THE FIX
      # FOR #2458. It used to sit after `Detect published release`, gated
      # on `released == 'true'`, which made the SBOM producible only in
      # the window after semantic-release returned. On 2026-10-29
      # semantic-release PUBLISHED v12.80.2 at 14:45:21 (78s in) and then
      # hung until the job's `timeout-minutes: 10` cancelled it at
      # 14:54:19 — so steps 7-10 were all `skipped`, the release shipped
      # with no asset, and v12.80.2 is the only release of the twelve
      # with an empty asset list. Generating first means the bytes exist
      # before anything slow or flaky can starve them.
      #
      # `continue-on-error` is load-bearing in the OTHER direction. With
      # generation ahead of the release, a hard failure here would stop
      # the release being cut at all — and a syft download 504 is a
      # measured event, not a hypothetical (#685, 2026-08-21). An SBOM is
      # a document ABOUT a release; it must never gate shipping one. The
      # failure is NOT thereby suppressed: `Attach SBOM` below fails loud
      # when a release published and no file is here, which is the
      # actionable property ("this release has no SBOM") rather than the
      # mechanism ("a CDN returned 504"). `sbom-backfill.yml` is the
      # repair path, and it argues for exactly this placement of the
      # signal.
      #
      # Named off the commit, not the tag: no tag exists yet at this
      # point, by construction.
      - name: Generate SBOM (SPDX-JSON)
        continue-on-error: true
        uses: anchore/sbom-action@v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: "sbom.spdx.json"
          artifact-name: "sbom-${{ github.sha }}.spdx.json"
          # Bounded because this now runs on EVERY main push rather than
          # only on publishing ones: ~2.5 MB a time, ~25 pushes a day.
          upload-artifact-retention: 14

      # semantic-release reads release.config.js and does everything:
      # analyze commits → determine version → generate notes → publish.
      #
      # Token: prefer a bypass-capable RELEASE_TOKEN (admin fine-grained PAT /
      # GitHub App) so the optional commit-back can push to protected main; fall
      # back to GITHUB_TOKEN (publish-only) when it isn't set. SEMANTIC_RELEASE_
      # COMMIT_BACK mirrors the token's presence and gates @semantic-release/git
      # in release.config.js — so with no token, no push to main is even attempted.
      - name: Run semantic-release
        # Bounds the #2458 hang at the STEP rather than letting it eat the
        # job budget: a step timeout is a clean step failure, so the steps
        # after it still run with time to spare, where a JOB cancellation
        # skipped all four. 6 min is ~4.6x the observed publish (78s) and
        # ~70x a no-op run (3-5s).
        timeout-minutes: 6
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          SEMANTIC_RELEASE_COMMIT_BACK: ${{ secrets.RELEASE_TOKEN != '' }}
        run: npx semantic-release

      # Re-read the newest tag after the release. If it changed, a new
      # GitHub Release was published this run and `released` is `true`;
      # `version` carries the tag (e.g. v1.2.3) for the SBOM asset
      # upload below.
      # `always()`, not `success()`: the whole point of #2458 is the case
      # where semantic-release PUBLISHED and then did not return cleanly.
      # Under `success()` this step skipped, `released` was never set, and
      # the attach below could not fire however it was gated. A genuine
      # failure before any tag was cut still reports `released=false` here,
      # so widening the gate does not invent a release.
      - name: Detect published release
        id: release
        if: always()
        run: |
          NEW_TAG="$(git describe --tags --abbrev=0 2>/dev/null || echo none)"
          echo "version=${NEW_TAG}" >> "$GITHUB_OUTPUT"
          if [ "${NEW_TAG}" != "none" ] && [ "${NEW_TAG}" != "${{ steps.prev_tag.outputs.tag }}" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "A new release was published: ${NEW_TAG}"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "No new release published this run."
          fi

      # Attach the SBOM generated at the top of this job to the
      # just-published GitHub Release. `gh release upload --clobber` is
      # idempotent if the workflow is re-run for the same tag.
      #
      # `always()` so a release that published without a clean return
      # still gets its asset — that is #2458. Still gated on
      # `released == 'true'`, so a no-op run attaches nothing.
      #
      # This step is ALSO where a missing SBOM becomes loud. Generation
      # is `continue-on-error`, so without the `test -s` below a syft
      # outage would ship a release with no asset and a green job — the
      # silent gap `sbom-backfill.yml` was written to argue against. The
      # package floor is that workflow's check, for its reason: a tree
      # with this lockfile cannot legitimately resolve to a handful of
      # packages, so a small count means syft scanned the wrong thing and
      # a zero-byte file would upload happily and look like a fix.
      - name: Attach SBOM to GitHub Release
        if: always() && steps.release.outputs.released == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG='${{ steps.release.outputs.version }}'

          if [ ! -s sbom.spdx.json ]; then
            echo "::error::${TAG} published but no SBOM was generated." \
                 "Repair it with the 'SBOM backfill' workflow:" \
                 "gh workflow run sbom-backfill.yml -f tag=${TAG}"
            exit 1
          fi

          PKGS="$(jq '.packages | length' sbom.spdx.json)"
          if [ "${PKGS}" -lt 100 ]; then
            echo "::error::SBOM for ${TAG} has only ${PKGS} packages —" \
                 "syft almost certainly scanned the wrong tree."
            exit 1
          fi
          echo "Attaching an SBOM of ${PKGS} packages to ${TAG}."

          gh release upload "${TAG}" sbom.spdx.json --clobber

      - name: Post release summary
        if: success()
        run: |
          echo "### 📦 Release Check Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "semantic-release analyzed commits and either:" >> $GITHUB_STEP_SUMMARY
          echo "- Created a new release (check [Releases](/${{ github.repository }}/releases))" >> $GITHUB_STEP_SUMMARY
          echo "- Determined no release-worthy changes exist" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.release.outputs.released }}" = "true" ]; then
            echo "- 🧾 SBOM (SPDX-JSON) generated + attached to release ${{ steps.release.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          fi
