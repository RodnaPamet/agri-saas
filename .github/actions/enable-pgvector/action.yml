name: Enable PostGIS and pgvector
description: >-
  Install the postgis and pgvector extensions into the running postgres
  service container from PGDG (the official PostgreSQL apt repo), so
  `CREATE EXTENSION postgis` works for the parcel-geometry migrations and
  `CREATE EXTENSION vector` works in the RAG migration. The service image is
  the stock `postgres` image; PGDG is the one apt repo added on top.
runs:
  using: composite
  steps:
    - name: Install postgresql-16-postgis-3 + postgresql-16-pgvector into the postgres service container
      shell: bash
      run: |
        set -euo pipefail

        # ── The image reference is DERIVED, never restated ──────────────
        #
        # This step has to find the service container the workflow started,
        # and `docker ps --filter ancestor=` is the only handle it has: the
        # job also runs a `redis` service, so "the only container" is not a
        # selector. A LITERAL image string here would be a TENTH copy of
        # the pin — and the only one that no `image:` line drags along when
        # the pin moves. The failure mode of a stale copy is a filter that
        # matches nothing,
        # which is the same observation as "matched nothing for some other
        # reason". So the string comes out of the one file that owns it.
        pin_file="${GITHUB_ACTION_PATH}/../../postgis-image"
        if [ ! -f "$pin_file" ]; then
          echo "::error::pin file not found at $pin_file — .github/postgis-image is the single source of truth for the service image" >&2
          exit 1
        fi
        # `|| true` because a comments-only pin file makes `grep` exit 1,
        # and under `set -euo pipefail` that aborts the step HERE with no
        # message — an unnamed death where the shape check below has a named
        # one. Let the empty string through so the diagnosis is printed.
        image="$(grep -v -E '^[[:space:]]*(#|$)' "$pin_file" | head -1 | tr -d '[:space:]' || true)"

        # POSITIVE CONTROL on the derivation itself. An empty or malformed
        # `$image` would make `--filter ancestor=` match every container (or
        # none) and the rest of this step would be reasoning about garbage.
        # Assert the shape BEFORE trusting anything downstream of it.
        if [[ ! "$image" =~ ^[a-z0-9._/-]+:[A-Za-z0-9._-]+$ ]]; then
          echo "::error::.github/postgis-image did not yield an image reference (got: '${image}')" >&2
          exit 1
        fi
        echo "resolved service image from .github/postgis-image: ${image}"

        # POSITIVE CONTROL on the selection. The old code took `head -1` of
        # the filter output, so "no container" and "one container" reached
        # the same line and only an emptiness check told them apart. Count
        # instead: exactly one match is the only correct answer, and both
        # zero and two are now distinct, named failures.
        mapfile -t cids < <(docker ps --filter "ancestor=${image}" --format '{{.ID}}')
        if [ "${#cids[@]}" -eq 0 ]; then
          echo "::error::no running container from ${image} — either the job declares no postgres service, or its image: line has drifted from .github/postgis-image" >&2
          docker ps --format 'running: {{.ID}} {{.Image}}' >&2
          exit 1
        fi
        if [ "${#cids[@]}" -gt 1 ]; then
          echo "::error::${#cids[@]} running containers from ${image} — refusing to guess which one is the test database" >&2
          docker ps --format 'running: {{.ID}} {{.Image}}' >&2
          exit 1
        fi
        cid="${cids[0]}"

        # ── The `Acquire::Check-Valid-Until=false` flag is GONE (#832) ──
        #
        # It was required, not defensive: the old base was Debian bullseye,
        # whose security `Release` file stopped being refreshed on
        # 2026-09-07T21:13:04Z, past which `apt-get update` exited 100 and
        # every job using this action failed. Debian re-signed that suite on
        # 2026-09-12 with no `Valid-Until` field, so the flag has been a
        # no-op since — it was load-bearing for five days. The note that stood here said
        # the flag would come out "when #832 lands a maintained-Debian base,
        # where a red run has one cause". This is that change: the base is
        # now `postgres:16-trixie`, whose suite has regular security support
        # until 2028-08-09. A stale index is no longer being worked around
        # because the index is not stale.
        #
        # That note also said migrating "means publishing our own image ...
        # a registry and supply-chain decision, not a tag edit". Half right.
        # Publishing our own image is a real option (A' in
        # docs/postgis-base-image-options.md §9) and it is NOT required:
        # PGDG carries both postgresql-16-postgis-3 and
        # postgresql-16-pgvector for trixie, so a stock `postgres` service
        # container plus this step is sufficient. Measured cost of adding
        # PostGIS here: 36s -> 50s per job, six jobs, in parallel.
        #
        # What DID stay true from that note: `postgis/postgis` still
        # publishes no Debian tag on a maintained suite for Postgres 16 —
        # its 16-3.5 is `FROM postgres:16-bullseye` and reproduces the same
        # exit 100. That is why the base is a plain postgres image now
        # rather than a newer postgis/postgis tag.
        # ── RETRIED, because this is a third-party network fetch and it was
        #    the one setup step without a retry (#2540) ──────────────────
        #
        # Measured: main went red on 2026-10-31 at 07:28 UTC (run
        # 41180732206, head 8407582ba — a byte-ceiling change touching no
        # infrastructure) because this step failed. `Test (shard 5/6)`,
        # `Test` and `Coverage (>=60%)` all went red and the TESTS NEVER RAN;
        # the next push to main passed untouched. So: transient, and
        # attributed to the wrong commit by everyone reading it.
        #
        # One apt hiccup reddens TWO required checks. The shard uploads no
        # coverage artifact, and `merge-coverage.mjs --expect N` correctly
        # refuses a short set — istanbul's merge UNIONS file sets, so a
        # missing shard would otherwise remove files from the DENOMINATOR and
        # percentages would RISE. That refusal is right, and it means an
        # `apt-get` failure presents as a coverage regression two steps from
        # its cause.
        #
        # `npm ci` and `prisma generate` in the same jobs have had 3-attempt
        # loops for exactly this reason, with comments that apply here
        # verbatim. This step reaches a third-party apt repo and was the one
        # that never got the treatment.
        #
        # WHY NOT BAKE THE EXTENSIONS INTO THE IMAGE INSTEAD. That was my
        # first instinct and it is the wrong trade here. The pin is STOCK
        # `postgres:16-trixie` by deliberate choice (#832): `postgis/postgis`
        # publishes no Debian tag on a maintained suite for Postgres 16, and
        # its only trixie tag forces a Postgres MAJOR bump. A baked image
        # would have to be ours, published to a registry — service containers
        # cannot be built in-workflow — and `.github/postgis-image` counts
        # ELEVEN spellings of this pin that a new image name would have to
        # move together, under a guard that checks all of them. A retry is
        # three lines.
        #
        # `timeout` is per ATTEMPT and load-bearing: without it the loop only
        # re-enters when `docker exec` RETURNS, so it defends against a fast
        # failure and not against a hung mirror — which is the defect
        # `ci-retry-loop-timeout` was written for after an 8-minute `npm ci`
        # stall ate a whole job budget. 120s against a ~20-40s normal install.
        #
        # AND THE LOCK CLEANUP IS INSIDE THE CONTAINER, not on the runner.
        # `timeout` kills the `docker exec` wrapper; the `apt-get` it started
        # keeps running in the container and holds ITS dpkg lock, so the next
        # attempt would fail instantly on a lock the runner's own `pkill`
        # cannot see. The `ci.yml` playwright loop clears runner-side locks
        # for the same reason — this is that idea across the container
        # boundary.
        installed=0
        for attempt in 1 2 3; do
          echo "::group::apt install postgis + pgvector (attempt $attempt/3)"
          if timeout 120 docker exec "$cid" sh -c 'apt-get update -qq && apt-get install -y -qq postgresql-16-postgis-3 postgresql-16-pgvector'; then
            echo "::endgroup::"
            installed=1
            break
          fi
          echo "::endgroup::"
          echo "::warning::postgis/pgvector install attempt $attempt/3 failed; clearing the container's dpkg lock"
          docker exec "$cid" sh -c 'pkill -9 apt-get || true; pkill -9 dpkg || true; rm -f /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/lib/apt/lists/lock || true; dpkg --configure -a || true' || true
          sleep 5
        done

        if [ "$installed" != "1" ]; then
          # Still fail CLOSED after three attempts. The extensions are a real
          # prerequisite — `CREATE EXTENSION postgis` is needed by the
          # parcel-geometry migrations — so a skipped install produces a worse
          # failure later, in `Apply Prisma migrations`, with an even less
          # obvious cause.
          echo "::error::postgis + pgvector could not be installed into container $cid after 3 attempts. This is a PGDG/apt fetch, so a sustained failure is usually upstream rather than this repo — check https://www.postgresql.org/support/ before changing the package list."
          exit 1
        fi
        echo "postgis + pgvector installed into container $cid"
