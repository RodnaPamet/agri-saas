# Test-only Postgres instance for local CI.
# Port 5435 avoids collision with the dev DB (5436/5437) and with the
# inflect-compliance stack (5433/5434).
# Usage: docker compose -f docker-compose.test.yml up -d
services:
  postgres-test:
    # PostGIS + pgvector (built from deploy/postgres/Dockerfile — same image
    # as the dev stack; mirrors CI's postgis service + enable-pgvector step).
    # Required by two migrations that plain postgres:16-alpine can't satisfy:
    # 20260613090735_ag_feature1_spray_map (`CREATE EXTENSION postgis`, for
    # Parcel.geometry) and 20260619100000_ai_rag_pgvector (`CREATE EXTENSION
    # vector`, for RAG embeddings). Without both, migrate deploy fails and
    # blocks every later migration (P3009).
    build:
      context: .
      dockerfile: deploy/postgres/Dockerfile
    # This tag REPEATS the base image's version: `16-3.4` is the tag in
    # `.github/postgis-image`, the single source of truth, spelled inside a
    # local image name. Bump the pin and bump this too — no
    # `postgis/postgis:` search can find this copy, and nothing
    # enforces agreement automatically yet (#860).
    image: agri-saas-postgres:16-3.4-pgvector
    container_name: agri-saas-test-db
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      # Repo-specific: the separate inflect-compliance product runs its
      # suite against the same host:port, and a shared database name lets
      # one repo's migrations land in the other's database.
      POSTGRES_DB: agri_saas_test
    ports:
      # 5435, distinct from BOTH the inflect-compliance stack (5433/5434)
      # and this repo's own dev stack (5436/5437). inflect's Postgres has
      # NO PostGIS, so when that stack held a port we also used, agri-saas
      # silently connected to a database where every geometry migration
      # fails. Distinct database NAMES were not enough; the port has to
      # differ too.
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d agri_saas_test"]
      interval: 3s
      timeout: 3s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data  # RAM disk — fast, wiped on stop
    volumes:
      - ./prisma/init-roles.sh:/docker-entrypoint-initdb.d/01-init-roles.sh:ro

  redis-test:
    image: redis:7-alpine
    container_name: agri-saas-test-redis
    command: redis-server --appendonly no --save ""
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
    tmpfs:
      - /data  # RAM disk — fast, wiped on stop

  clamav-test:
    image: clamav/clamav:1.4
    container_name: agri-saas-test-clamav
    ports:
      - "3311:3310"
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    tmpfs:
      - /var/lib/clamav  # RAM disk — ephemeral defs for tests
